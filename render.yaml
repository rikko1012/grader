# Render Blueprint for the CS2 Scout grader (Python, Docker). In Render: New -> Blueprint -> this repo.
# Secrets (sync: false) are entered in the Render dashboard, never in this file.
services:
  - type: web
    name: cs2-scout
    runtime: docker
    plan: standard            # the board loop + 700 concurrent members need steady CPU and RAM
    region: ohio              # closest to the Neon project (aws-us-east-2) and the HLTV database
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: cs2-scout-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: CS2_DATA_DIR
        value: /data
      - key: PORT
        value: "8000"
      - key: PRELOAD
        value: "1"
      - key: REQUIRE_WHOP
        value: "1"
      - key: PUBLIC_URL
        sync: false           # https://<service>.onrender.com (or the custom domain) - also set as the Whop app's redirect
      - key: ADMIN_TOKEN
        sync: false
      - key: WHOP_CLIENT_ID
        sync: false
      - key: WHOP_CLIENT_SECRET
        sync: false
      - key: WHOP_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false           # long random value: keeps member sessions valid when the Whop secret rotates
      - key: HLTV_DB_DSN
        sync: false           # the hltv-scraper Postgres (projections, settlement, PrizePicks backup copy)
      - key: FACEIT_API_KEY
        sync: false
      # ---- Scout Sports (sports/RUNBOOK.md). ALL OFF: with these off nothing from sports/ is imported here.
      - key: SPORTS_UI
        value: "0"
      - key: SPORTS_API
        value: "0"
      - key: SPORTS_API_MODE
        value: service        # esports only mints member tokens + serves the static page; never runs sports work
      - key: SPORTS_API_BASE
        sync: false           # public origin of scout-sports-api, e.g. https://scout-sports-api.onrender.com
      - key: SPORTS_TOKEN_SECRET
        sync: false           # >= 32 random characters; the SAME value on scout-sports-api

  # Scout Sports API + its worker children (owner approved 2026-10-23). Its own container, CPU, memory and disk, so a
  # sports load / failure cannot reach esports request threads. Ingestion, snapshot prebuild, slip spool jobs, the
  # assistant runner and the lab runner run as supervised CHILD processes of the service (sports/service.py
  # schedule()), each behind its own flag - not separate Render workers - because a Render disk attaches to one
  # service only and they all share the sports store / spools on it (sports/RUNBOOK.md "Architecture").
  # Flags OFF: the service answers only /api/sports/health until SPORTS_API=1; no child runs until its flag is on.
  - type: web
    name: scout-sports-api
    runtime: docker
    dockerfilePath: ./Dockerfile.sports   # requirements-sports.txt (anthropic SDK); the esports Dockerfile is unchanged
    dockerCommand: python -m sports.service
    plan: standard            # 2 GB / 1 CPU for API + ingestion + assistant (measured: service <= 50 MB at 700 members,
                              # ingestion 110-130 MB per cycle). Move to Pro (4 GB) BEFORE SPORTS_TRAIN=1 (lab training
                              # child capped at SPORTS_WORKER_MAX_MB like the ingestion child) - RUNBOOK section 6
    region: ohio
    healthCheckPath: /api/sports/health
    autoDeploy: false         # deploy by hand during the staged rollout
    disk:
      name: scout-sports-data
      mountPath: /sports-data
      sizeGB: 20              # measured: ~50 MB first cycle, ~300 MB history ingestion, +10-15 MB/hour (~0.3 GB/day)
    envVars:
      - key: PORT
        value: "10000"
      - key: SPORTS_DATA_DIR
        value: /sports-data
      - key: SPORTS_API
        value: "0"
      - key: SPORTS_UI
        value: "0"
      - key: SPORTS_INGEST
        value: "0"
      - key: SPORTS_TRAIN
        value: "0"            # the lab runner child (python -m sports.lab.runner)
      - key: SPORTS_ASSISTANT
        value: "0"            # the assistant runner child (python -m sports.assistant.runner) + its routes
      - key: SPORTS_ASSIST_MODEL
        value: claude-opus-5-5
      - key: ANTHROPIC_API_KEY
        sync: false           # read only by the assistant runner child; Environment tab only, never in git
      - key: SPORTS_TOKEN_SECRET
        sync: false           # the SAME value as on cs2-scout
      - key: SPORTS_ALLOWED_ORIGINS
        sync: false           # https://cs2-scout.onrender.com (plus the custom domain if members use one), comma list
      - key: ADMIN_TOKEN
        sync: false           # the same admin token as cs2-scout (X-Admin-Token for /api/sports/admin/ops)
      - key: ODDS_API_KEY
        sync: false           # optional The Odds API key - set in the Environment tab only, never in git
      - key: SPORTS_LEAGUES
        value: nba nfl
      - key: SPORTS_INGEST_EVERY_MIN
        value: "10"
      - key: SPORTS_KALSHI_EVERY_MIN
        value: "30"
      - key: SPORTS_WORKER_MAX_MB
        value: "768"
      - key: SPORTS_STORE_MAX_MB
        value: "16000"        # ingestion pauses itself at 16 GB of the 20 GB disk
      - key: SPORTS_SERVICE_MAX_MB
        value: "900"
      - key: SPORTS_SERVICE_THREADS
        value: "32"
      - key: SPORTS_DB_POOL
        value: "4"
      - key: SPORTS_REQUEST_BUDGET_S
        value: "4"
