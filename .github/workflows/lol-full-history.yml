# LoL full history: Leaguepedia live check, every game from both sources since 2025, cross-source check, and the
# full-history backtest (lol/EVALUATION.md). LoL only - it never touches the CS2 code, data or database.
#
# Runs where the Leaguepedia secrets live (repository secrets LEAGUEPEDIA_USER, LEAGUEPEDIA_BOT_PASSWORD), the HLTV
# scraper's pattern: a GitHub Actions job fetches, the scout reads.
#   - LOL_DB_DSN secret set and reachable: the history goes into LoL's own PostgreSQL and stays there.
#   - not set / not reachable (warned): a temporary database inside the job; results printed and kept as an artifact.
# The API answers (lol cache.db) are kept between runs (actions/cache), so a re-run never downloads a finished game twice.
# Starts when this file is pushed on the LoL branch (re-run it from the Actions tab); never on main, never on a schedule
# (the recurring sync is lol/deploy/lol-sync.yml).
name: lol-full-history

on:
  push:
    branches: [claude/keen-carson-tk8gbd]
    paths: [.github/workflows/lol-full-history.yml]
  workflow_dispatch:

concurrency:
  group: lol-full-history
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash          # -eo pipefail: a failing sync fails its step even when piped

jobs:
  full-history:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # GitHub-hosted maximum is 360; Leaguepedia covers every league, minor ones too
    env:
      LEAGUEPEDIA_USER: ${{ secrets.LEAGUEPEDIA_USER }}
      LEAGUEPEDIA_BOT_PASSWORD: ${{ secrets.LEAGUEPEDIA_BOT_PASSWORD }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: LoL data folder for this job (the runner context exists only inside steps)
        run: echo "LOL_DATA_DIR=$RUNNER_TEMP/lol" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Restore the LoL API cache from the last run
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/lol/cache.db*
          key: lol-api-cache-${{ github.run_id }}
          restore-keys: lol-api-cache-

      - name: LoL tests (offline)
        run: python -m pytest lol/tests -q -p no:cacheprovider

      - name: Leaguepedia credentials present (names only, never the values)
        run: |
          [ -n "$LEAGUEPEDIA_USER" ] && [ -n "$LEAGUEPEDIA_BOT_PASSWORD" ] || { echo "LEAGUEPEDIA secrets missing"; exit 1; }
          echo "both set"

      - name: LoL database (its own PostgreSQL when LOL_DB_DSN is set and reachable, else a temporary one)
        env:
          DSN: ${{ secrets.LOL_DB_DSN }}
        run: |
          if [ -z "$DSN" ]; then echo "LOL_DB_DSN not set - temporary database for this job"; exit 0; fi
          if LOL_DB_DSN="$DSN" python -c "from lol import history; db = history.DB(); print('tables ready:', [r['source'] for r in history.summary(db)][:5]); db.close()"; then
            echo "LOL_DB_DSN=$DSN" >> "$GITHUB_ENV"
            echo "LoL PostgreSQL reachable - the history is written there and kept"
          else
            echo "::warning::LOL_DB_DSN is set but the database is not reachable - this job uses a temporary database"
          fi

      - name: Leaguepedia live check (login, one week, fields, league short names)
        run: python -m lol.checks leaguepedia

      # Leaguepedia a quarter per step: each step's finish time shows the progress while the job runs
      - name: Leaguepedia 2025-01-01 .. 2025-04-01 (1 request / second; finished weeks are kept and skipped on a re-run)
        run: python lol_scout.py sync --source leaguepedia --since 2025-01-01 --until 2025-04-01 | tail -c 3000
      - name: Leaguepedia 2025-04-01 .. 2025-07-01 (1 request / second; finished weeks are kept and skipped on a re-run)
        run: python lol_scout.py sync --source leaguepedia --since 2025-04-01 --until 2025-07-01 | tail -c 3000
      - name: Leaguepedia 2025-07-01 .. 2025-10-01 (1 request / second; finished weeks are kept and skipped on a re-run)
        run: python lol_scout.py sync --source leaguepedia --since 2025-07-01 --until 2025-10-01 | tail -c 3000
      - name: Leaguepedia 2025-10-01 .. 2026-01-01 (1 request / second; finished weeks are kept and skipped on a re-run)
        run: python lol_scout.py sync --source leaguepedia --since 2025-10-01 --until 2026-01-01 | tail -c 3000
      - name: Leaguepedia 2026-01-01 .. 2026-04-01 (1 request / second; finished weeks are kept and skipped on a re-run)
        run: python lol_scout.py sync --source leaguepedia --since 2026-01-01 --until 2026-04-01 | tail -c 3000
      - name: Leaguepedia 2026-04-01 .. 2026-07-01 (1 request / second; finished weeks are kept and skipped on a re-run)
        run: python lol_scout.py sync --source leaguepedia --since 2026-04-01 --until 2026-07-01 | tail -c 3000
      - name: Leaguepedia 2026-07-01 .. 2026-10-01 (1 request / second; finished weeks are kept and skipped on a re-run)
        run: python lol_scout.py sync --source leaguepedia --since 2026-07-01 --until 2026-10-01 | tail -c 3000
      - name: Leaguepedia 2026-10-01 .. 2026-10-19 (1 request / second; finished weeks are kept and skipped on a re-run)
        run: python lol_scout.py sync --source leaguepedia --since 2026-10-01 --until 2026-10-19 | tail -c 3000

      - name: Sync the LoL Esports feed since 2025-01-01 (4 requests / second per host)
        run: python lol_scout.py sync --source lolesports --since 2025-01-01 | tail -c 4000

      - name: Coverage and missing games
        run: |
          python lol_scout.py status > "$LOL_DATA_DIR/status.json"
          python - <<'EOF'
          import json, os
          d = json.load(open(os.path.join(os.environ["LOL_DATA_DIR"], "status.json")))
          m = d["missing_games"]
          print("missing games:", m["total"], "| filled by Leaguepedia:", m["filled_by_leaguepedia"],
                "| still missing:", len(m["still_missing"]))
          for r in d["history"]:
              print(f"  {r['source']} {str(r['league'])[:28]:28s} {r['matches']:6d} matches {r['games']:7d} games  "
                    f"{str(r['first'])[:10]} .. {str(r['last'])[:10]}")
          for x in m["still_missing"][:30]:
              print("  still missing:", x)
          EOF

      - name: Cross-source check (games both sources hold)
        run: python -m lol.checks crosscheck | tee "$LOL_DATA_DIR/crosscheck.json"

      - name: Backtest - full-history protocol (lol/EVALUATION.md)
        run: |
          python -m lol.backtest --train-from 2025-03-01 --test-from 2026-04-01 --test-to 2026-10-17 \
            --json "$LOL_DATA_DIR/full_report.json" --write
          echo "----- lol/model_fit.json -----"
          cat lol/model_fit.json
          cp lol/model_fit.json "$LOL_DATA_DIR/model_fit.json"

      - name: Save the LoL API cache for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/lol/cache.db*
          key: lol-api-cache-${{ github.run_id }}

      - name: Keep the results (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lol-full-history
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lol/*.json
            ${{ runner.temp }}/lol/history.db
