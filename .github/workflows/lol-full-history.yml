# PR checks are offline. The long source collection is manual and publishes raw
# records to Scout's inbox; only Scout's canonical exporter writes serving history.
name: lol-full-history

on:
  push:
    branches: [claude/keen-carson-tk8gbd]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "full = collect then publish; publish-only = republish the cached source records (a retry: must add nothing)"
        required: false
        default: full
        type: choice
        options: [full, publish-only]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lol_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LOL_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/lol_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - name: LoL and CS2 regression checks (no provider credentials)
        run: python -m pytest lol/tests tests -q -p no:cacheprovider

  # Sports (NFL/NBA) runs as its own job: a sports failure is visible on its own and never blocks or changes the
  # esports job above, which the manual full-history collection depends on (sports/INTEGRATION_MANIFEST.md).
  sports-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - name: Sports regression checks (no provider credentials, no network)
        run: python -m pytest sports/tests -q -p no:cacheprovider

  full-history:
    if: github.event_name == 'workflow_dispatch'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: lol-full-history-collector
      cancel-in-progress: false
    env:
      LEAGUEPEDIA_USER: ${{ secrets.LEAGUEPEDIA_USER }}
      LEAGUEPEDIA_BOT_PASSWORD: ${{ secrets.LEAGUEPEDIA_BOT_PASSWORD }}
      LOL_HANDOFF_DSN: ${{ secrets.LOL_DB_DSN }}
      LOL_DB_DSN: '' # never replace Scout's serving tables from an isolated job
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Isolated paths and full-history window
        run: |
          echo "LOL_DATA_DIR=$RUNNER_TEMP/lol" >> "$GITHUB_ENV"
          echo "LOL_CENTER_DB=$RUNNER_TEMP/lol/center/lol.db" >> "$GITHUB_ENV"
          python - <<'PY'
          import os
          from datetime import datetime, timezone, date
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('LOL_BACKFILL_DAYS=%d\n' % (datetime.now(timezone.utc).date() - date(2025, 1, 1)).days)
          PY
      - name: Restore resumable source history and API cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/lol/center/lol.db*
            ${{ runner.temp }}/lol/cache.db*
          key: lol-canonical-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lol-canonical-history-v1-
      - name: Credentials and persistent Scout handoff required (names only)
        run: |
          [ -n "$LEAGUEPEDIA_USER" ] && [ -n "$LEAGUEPEDIA_BOT_PASSWORD" ] && [ -n "$LOL_HANDOFF_DSN" ] || { echo 'Missing Leaguepedia credentials or LOL_DB_DSN repository secret'; exit 1; }
          python - <<'PY'
          import os
          from lol.center import handoff
          try:
              c = handoff._connect(os.environ['LOL_HANDOFF_DSN'])
              c.close()
          except Exception as e:
              raise SystemExit('Scout handoff connection failed: ' + type(e).__name__) from None
          print('Scout handoff reachable')
          # a refused bot login would otherwise read anonymously (refused since 2026-10-17): every unit fails, the
          # sync still exits 0 and the run looks green with no Leaguepedia data. LOGIN never holds the credentials.
          from lol.center import cargo
          cargo._opener()
          if cargo.LOGIN['result'] != 'Success':
              raise SystemExit('Leaguepedia bot login failed: %s %s' % (cargo.LOGIN['result'], cargo.LOGIN['note'] or ''))
          print('Leaguepedia bot login OK')
          PY
      - name: Leaguepedia canonical history (resumable, bounded)
        if: inputs.mode != 'publish-only'
        run: python lol_scout.py sync --source leaguepedia --max-minutes 180
      - name: LoL Esports canonical history (resumable, bounded)
        if: inputs.mode != 'publish-only'
        run: python lol_scout.py sync --source lolesports --max-minutes 90
      - name: Publish collected source records to Scout (also on partial completion)
        if: always()
        run: python -m lol.center.handoff
      - name: Coverage and cross-source reconciliation
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from lol.center import coverage, ingest, store
          c = store.connect()
          try:
              report = {'coverage': coverage.compute(c), 'ingest': ingest.progress(c), 'last_export': store.get_meta(c, 'last_export')}
              Path(os.environ['LOL_DATA_DIR'], 'coverage.json').write_text(json.dumps(report, indent=2))
              print(json.dumps(report['ingest']['tables'], indent=2))
          finally:
              c.close()
          PY
      # Model selection stays in the registered evaluation process. A scraper run
      # never opens TEST, overwrites model_fit.json or promotes a production fit.
      - name: Save resumable history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/lol/center/lol.db*
            ${{ runner.temp }}/lol/cache.db*
          key: lol-canonical-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep collected history and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lol-full-history
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lol/*.json
            ${{ runner.temp }}/lol/history.db
            ${{ runner.temp }}/lol/center/lol.db*
