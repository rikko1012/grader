# OPT-IN deployment template for the Scout Sports API service (sports/RUNBOOK.md section 6). NOT a live Blueprint.
#
# Render auto-syncs only the repository-root render.yaml. This file sits outside it on purpose: a merge or a
# Blueprint sync never creates, resizes or re-plans anything from it. Declared resources are PAID and are billed from
# creation whatever the SPORTS_* flags say.
#
# What exists (created by the owner by hand in the Render dashboard on 2026-10-24 under the owner's Starter
# authorization - NOT from this file): scout-sports-api, Ohio, Starter instance ($7/month) + 5 GB disk at
# /sports-data ($1.25/month) = $8.25/month, auto-deploy off, every SPORTS_* flag 0, no secrets yet. This file mirrors
# that instance as a record / re-creation aid. Do not apply it as a Blueprint while that service exists.
# NOT authorized: the Standard instance ($25/month) and a 20 GB disk ($5/month) - pending the owner's explicit cost
# approval. Do not change `plan` or `sizeGB` (here or in the dashboard) until then.
# Memory limits below are the TEMPORARY disabled-instance values (service 200 MB / worker 220 MB / store 4,000 MB);
# replace them only with measured Starter settings once those are merged (Starter scheduling / memory work, PR17).
# Release gate: the +10% esports p99 budget FAILED locally (+14%) and stays pending a staging re-run (RUNBOOK
# sections 11-12); member enablement is blocked until that passes. Workers stay off until the staged enable.
#
# Contents: the scout-sports-api service exactly as the staged rollout expects it. The API and its worker children
# (ingestion, snapshot prebuild, slip spool jobs, assistant runner, lab runner) run as supervised CHILD processes of
# the service (sports/service.py schedule()), each behind its own flag, because a Render disk attaches to one service
# only and they all share the sports store / spools on it (sports/RUNBOOK.md "Architecture"). Flags OFF: the service
# answers only /api/sports/health until SPORTS_API=1; no child runs until its flag is on.
# Secrets (sync: false) are entered in the Render dashboard, never in this file.
services:
  - type: web
    name: scout-sports-api
    runtime: docker
    dockerfilePath: ./Dockerfile.sports   # requirements-sports.txt (anthropic SDK); the esports Dockerfile is unchanged
    dockerCommand: python -m sports.service
    plan: starter             # 512 MB / 0.5 CPU - owner Starter authorization. Standard (2 GB / 1 CPU, $25/month) is
                              # pending explicit cost approval; Pro (4 GB) would be needed BEFORE SPORTS_TRAIN=1
    region: ohio
    healthCheckPath: /api/sports/health
    autoDeploy: false         # deploy by hand during the staged rollout
    disk:
      name: scout-sports-data
      mountPath: /sports-data
      sizeGB: 5               # Starter disk; growth + retention: sports/RETENTION.md (20 GB pending cost approval)
    envVars:
      - key: PORT
        value: "10000"
      - key: SPORTS_DATA_DIR
        value: /sports-data
      - key: SPORTS_API
        value: "0"
      - key: SPORTS_UI
        value: "0"
      - key: SPORTS_INGEST
        value: "0"
      - key: SPORTS_TRAIN
        value: "0"            # the lab runner child (python -m sports.lab.runner)
      - key: SPORTS_ASSISTANT
        value: "0"            # the assistant runner child (python -m sports.assistant.runner) + its routes
      - key: SPORTS_ASSIST_MODEL
        value: claude-opus-5-5
      - key: ANTHROPIC_API_KEY
        sync: false           # read only by the assistant runner child; Environment tab only, never in git
      - key: SPORTS_TOKEN_SECRET
        sync: false           # the SAME value as on cs2-scout
      - key: SPORTS_ALLOWED_ORIGINS
        sync: false           # https://cs2-scout.onrender.com (plus the custom domain if members use one), comma list
      - key: ADMIN_TOKEN
        sync: false           # the same admin token as cs2-scout (X-Admin-Token for /api/sports/admin/ops)
      - key: ODDS_API_KEY
        sync: false           # optional The Odds API key - set in the Environment tab only, never in git
      - key: SPORTS_LEAGUES
        value: nba nfl
      - key: SPORTS_INGEST_EVERY_MIN
        value: "10"
      - key: SPORTS_KALSHI_EVERY_MIN
        value: "30"
      - key: SPORTS_WORKER_MAX_MB
        value: "220"          # TEMPORARY disabled-instance value (see header)
      - key: SPORTS_STORE_MAX_MB
        value: "4000"         # TEMPORARY: ingestion pauses itself at 4 GB of the 5 GB disk (sports/RETENTION.md)
      - key: SPORTS_SERVICE_MAX_MB
        value: "200"          # TEMPORARY disabled-instance value (see header)
      - key: SPORTS_SERVICE_THREADS
        value: "32"           # Standard-sized; the Starter value comes with the measured Starter settings
      - key: SPORTS_DB_POOL
        value: "4"            # Standard-sized; as above
      - key: SPORTS_REQUEST_BUDGET_S
        value: "4"
