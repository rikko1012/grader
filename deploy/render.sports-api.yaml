# Deployment template for the Scout Sports API service on Render STARTER (sports/RUNBOOK.md sections 6-7, "Starter").
#
# Render auto-syncs only the repository-root render.yaml. This file sits outside it on purpose: nothing here is
# created by a merge or a Blueprint sync. The owner CREATED the service scout-sports-api (2026-10-24) in the Render
# dashboard; this file is the reference for its settings - apply them by hand in that service's Settings / Disks /
# Environment tabs (RUNBOOK section 6). Never create a second service from it.
#
# Owner requirement (2026-10-24): the cheapest plan that keeps every piece of data. Starter = 512 MB RAM, 0.5 CPU,
# the cheapest PAID plan that can have a persistent disk ($7 / month + $0.25 per GB-month of disk). Member access stays
# OFF pending a staging pass (RUNBOOK section 7). Free instances have no
# disk and sleep - not acceptable for keeping data.
#
# Memory (measured 2026-10-24, sports/research/results/starter_2026-10-24): service ~34 MB idle with the slim slip
# pool; background jobs are child processes admitted by a memory-reservation queue (sports/scheduler.py): at most ONE
# heavy child, exclusive jobs (collector cycle 274 MB, model forecast 311 MB, fit 308 MB) alone, every child killed
# above its cap. Disk: existing owner-approved 5 GB to start with alerts at 80 % / 90 % (disk_80 / disk_90); Render disks can be ENLARGED
# later without data loss (never shrunk) - projection and procedure in RUNBOOK "Starter disk".
#
# Flags OFF: the service answers only /api/sports/health until SPORTS_API=1; no child runs until its flag is on.
# Secrets (sync: false) are entered in the Render dashboard, never in this file.
services:
  - type: web
    name: scout-sports-api
    runtime: docker
    dockerfilePath: ./Dockerfile.sports   # requirements-sports.txt (anthropic SDK); the esports Dockerfile is unchanged
    dockerCommand: python -m sports.service
    plan: starter             # 512 MB / 0.5 CPU - RUNBOOK "Starter memory budget"
    region: ohio
    healthCheckPath: /api/sports/health
    autoDeploy: false         # deploy by hand during the staged rollout
    disk:
      name: scout-sports-data
      mountPath: /sports-data
      sizeGB: 5               # existing approved disk; enlargement requires owner approval
    envVars:
      - key: PORT
        value: "10000"
      - key: SPORTS_DATA_DIR
        value: /sports-data
      - key: SPORTS_API
        value: "0"
      - key: SPORTS_UI
        value: "0"
      - key: SPORTS_INGEST
        value: "0"
      - key: SPORTS_TRAIN
        value: "0"            # model forecast / learn / snapshot / fit + the lab (worker `train` commands need it)
      - key: SPORTS_FORECAST
        value: "0"            # forward forecasts, INFERENCE ONLY (sports/model/fwd.py; frozen hash-verified artifacts, no
                              # fit / learn / retrain); set "1" to forecast - SPORTS_TRAIN stays "0" (RUNBOOK 13.5)
      - key: SPORTS_ASSISTANT
        value: "0"            # the on-demand assistant runner + its routes
      - key: SPORTS_ASSIST_MODEL
        value: claude-opus-5-5
      - key: ANTHROPIC_API_KEY
        sync: false           # read only by the assistant runner child; Environment tab only, never in git
      - key: SPORTS_TOKEN_SECRET
        sync: false           # the SAME value as on cs2-scout (already set by the owner)
      - key: SPORTS_ALLOWED_ORIGINS
        sync: false           # https://cs2-scout.onrender.com (plus the custom member domain if one is used)
      - key: ADMIN_TOKEN
        sync: false           # the same admin token as cs2-scout (X-Admin-Token for /api/sports/admin/ops)
      - key: ODDS_API_KEY
        sync: false           # The Odds API key (already saved by the owner)
      - key: SPORTS_LEAGUES
        value: nba nfl
      # ---- Starter service limits
      - key: SPORTS_SERVICE_THREADS
        value: "16"
      - key: SPORTS_SERVICE_MAX_MB
        value: "160"          # the service drains and restarts above this (measured ~34 MB idle)
      - key: SPORTS_DB_POOL
        value: "2"
      - key: SPORTS_REQUEST_BUDGET_S
        value: "4"
      - key: SPORTS_BOARD_CACHE_MB
        value: "16"
      - key: SPORTS_CACHE_MAX
        value: "64"
      - key: SPORTS_GZIP_CACHE_MB
        value: "12"
      - key: SPORTS_ARCHIVE_CACHE_MB
        value: "32"
      # ---- Starter job scheduler (sports/scheduler.py; every job's cadence / cap can be overridden the same way)
      - key: SPORTS_CHILD_BUDGET_MB
        value: "310"
      - key: SPORTS_JOB_INGEST_EVERY_S
        value: "900"          # the collector cycle every 15 min (was 10)
      - key: SPORTS_JOB_INGEST_KALSHI_EVERY_S
        value: "3600"         # Kalshi hourly (was 30 min)
      - key: SPORTS_JOB_UI_SNAPSHOTS_EVERY_S
        value: "180"          # member page snapshots every 3 min (was 60 s)
      - key: SPORTS_JOB_PREBUILT_EVERY_S
        value: "90"           # slip pool every 90 s (was 45 s)
      - key: SPORTS_WORKER_MAX_MB
        value: "310"          # RSS backstop; scheduler applies each job's measured RSS cap
      - key: SPORTS_WORKER_MAX_VM_MB
        value: "320"          # measured ingest/Kalshi/settle address-space cap; TRAIN stays off
      # ---- storage
      - key: SPORTS_ARCHIVE_AFTER_H
        value: "72"           # offers not seen for 72 h move to the compressed archive (nothing is deleted)
      - key: SPORTS_STORE_MAX_MB
        value: "4000"         # pause ingestion at 4 GB across the entire data directory
