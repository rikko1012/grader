<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>1Time Scout Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/workspace/workspace.css">
</head>
<body>
<a class="skip" id="skip" href="#main">Skip to content</a>

<div id="app" class="app">
  <header class="top" id="top">
    <a class="brand" href="#/research" aria-label="1Time Scout, board">
      <span class="brand-mark" aria-hidden="true">1T</span>
      <span class="brand-word">1TIME SCOUT</span>
    </a>
    <div class="top-search" id="top-search">
      <label class="sr" for="search">Search player, team or game</label>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="search" type="search" placeholder="Search player, team, game" autocomplete="off" spellcheck="false">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <button class="icon-btn search-toggle" id="search-toggle" type="button" aria-label="Search" aria-expanded="false">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
    </button>
    <p class="account" id="account"><span class="avatar" id="avatar" aria-hidden="true"></span><span class="account-name" id="account-name"></span></p>
  </header>

  <nav class="nav" id="nav" aria-label="Workspace">
    <ul class="nav-list">
      <li><a href="#/research" data-nav="research" title="Board"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="sr">Board</span></a></li>
      <li><a href="#/matches" data-nav="matches" title="Matches"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span class="sr">Matches</span></a></li>
      <li><a href="#/slips" data-nav="slips" title="Slips"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg><span class="sr">Slips</span></a></li>
      <li><a href="#/picks" data-nav="picks" title="My picks"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg><span class="sr">My picks</span></a></li>
      <li><a href="#/results" data-nav="results" title="Results"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span class="sr">Results</span></a></li>
    </ul>
  </nav>

  <main class="main" id="main" tabindex="-1">
    <div class="strip" id="session-strip" role="alert" hidden></div>
    <section class="view" id="view-research" aria-labelledby="board-h">
      <h1 class="sr" id="board-h">Board</h1>
      <div class="toolbar" id="toolbar">
        <div class="chips" id="chips" role="group" aria-label="Sport"></div>
        <div class="filter-row">
          <label class="pick"><span class="sr">Day</span><select id="f-day"></select></label>
          <label class="pick"><span class="sr">Market</span><select id="f-market"></select></label>
          <button class="btn btn-quiet more-btn" id="open-filters" type="button"><span id="more-label">Filters</span></button>
          <p class="board-meta" id="board-meta" aria-live="polite"></p>
        </div>
      </div>
      <div class="board-head" id="board-head"></div>
      <div class="board-scroll" id="board-scroll">
        <div id="feed-strips"></div>
        <div id="board-list" tabindex="-1"></div>
      </div>
    </section>

    <section class="view view-page" id="view-matches" aria-labelledby="matches-h" hidden></section>
    <section class="view view-page" id="view-slips" aria-labelledby="slips-h" hidden></section>
    <section class="view view-page" id="view-picks" aria-labelledby="picks-h" hidden></section>
    <section class="view view-page" id="view-results" aria-labelledby="results-h" hidden></section>
  </main>

  <aside class="rail" id="rail" aria-labelledby="rail-h">
    <div class="rail-inner" id="rail-body"></div>
  </aside>

  <section class="panel" id="panel" role="dialog" aria-modal="false" aria-labelledby="panel-name" hidden></section>
  <div class="panel-scrim" id="panel-scrim" hidden></div>

  <button class="slip-fab" id="slip-fab" type="button" aria-haspopup="dialog"></button>

  <nav class="bottom" id="bottom" aria-label="Workspace, phone">
    <a href="#/research" data-nav="research"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Board</span></a>
    <a href="#/matches" data-nav="matches"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Matches</span></a>
    <a href="#/slips" data-nav="slips"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg><span>Slips</span></a>
    <a href="#/picks" data-nav="picks"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg><span>My picks</span></a>
    <a href="#/results" data-nav="results"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Results</span></a>
  </nav>
</div>

<dialog class="drawer" id="filters-dialog" aria-labelledby="filters-h">
  <form method="dialog" class="dialog-head">
    <h2 id="filters-h" class="display">Filters</h2>
    <button class="icon-btn" value="close" aria-label="Close filters"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </form>
  <div class="dialog-body" id="filters-body"></div>
  <div class="dialog-foot"><button class="btn btn-gold btn-block" id="filters-done" type="button"></button></div>
  <div class="toast" data-toast role="status" aria-live="polite"></div>
</dialog>

<dialog class="sheet" id="slip-dialog" aria-labelledby="sheet-h">
  <form method="dialog" class="dialog-head">
    <h2 id="sheet-h" class="display">Your slip</h2>
    <button class="icon-btn" value="close" aria-label="Close slip"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </form>
  <div class="dialog-body" id="sheet-body"></div>
  <div class="toast" data-toast role="status" aria-live="polite"></div>
</dialog>

<div class="toast" id="toast" data-toast role="status" aria-live="polite"></div>
<div class="chart-tip" id="chart-tip" hidden></div>

<noscript><p class="noscript">This page needs JavaScript.</p></noscript>
<script src="/preview/workspace/workspace-data.js"></script>
<script src="/preview/workspace/workspace.js"></script>
</body>
</html>
