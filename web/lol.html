<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1time Scout · LoL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#090b10;--panel:#11151d;--panel-2:#191f29;--line:#262e3b;--line-2:#3b4659;--text:#f4f5f7;--muted:#a9b2c2;--faint:#8f9bb0;
  --accent:#f7a45b;--accent-2:#ffc595;--up:#4cc76a;--dn:#ff9b5e;--warn:#e3b341;--display:"Chakra Petch",system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}
button,select,a{touch-action:manipulation}button:focus-visible,a:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:0 20px;height:64px;border-bottom:1px solid var(--line);background:#090b10f2;backdrop-filter:blur(12px)}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#ff7a1a,var(--accent));display:grid;place-items:center;flex-shrink:0}
h1{font:700 17px var(--display);letter-spacing:.4px;margin:0;white-space:nowrap}h1 em{font-style:normal;color:var(--accent-2)}.grow{flex:1}
.sportsw{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;background:#0b1018}
.sportsw a{color:var(--muted);text-decoration:none;font:600 12px Inter,system-ui;padding:7px 14px;border-radius:999px;min-height:32px;display:inline-flex;align-items:center}
.sportsw a.on{background:var(--accent);color:#18120e}.sportsw a:not(.on):hover{color:var(--text);background:#ffffff0d}
#who{font-size:12px;color:var(--muted);white-space:nowrap}#who a{color:var(--muted)}
.wrap{max-width:1440px;margin:0 auto;padding:20px 20px 80px}.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:6px 0 16px}
.eyebrow{font:10px var(--mono);letter-spacing:.16em;color:var(--accent-2);text-transform:uppercase}
.intro h2{font:600 clamp(24px,3vw,34px)/1.15 var(--display);margin:6px 0 4px;letter-spacing:-.5px}.intro p{margin:0;color:var(--muted);font-size:13px;max-width:640px}
.feeds{font-size:12px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}.feeds b{color:var(--text);font-weight:600}
.banner.lhold{border-color:#8bb8ff55;background:#8bb8ff12;color:#cfe0ff}
.banner{border:1px solid #e3b34155;background:#e3b34112;color:#f2d27a;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:#0b1018}
.seg button{background:transparent;color:var(--muted);border:0;padding:0 14px;min-height:40px;font:500 13px Inter,system-ui;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:var(--panel-2);color:var(--accent-2)}
select{background:#0b1018;color:var(--text);border:1px solid var(--line-2);border-radius:10px;min-height:40px;padding:0 10px;font:13px Inter,system-ui;max-width:100%}
.bar input[type=search]{background:#0b1018;color:var(--text);border:1px solid var(--line-2);border-radius:10px;min-height:40px;padding:0 12px;font:13px Inter,system-ui;flex:1 1 200px;min-width:0;max-width:320px}
label.chk{display:inline-flex;align-items:center;gap:8px;min-height:40px;color:var(--muted);font-size:13px;cursor:pointer}label.chk input{width:18px;height:18px;accent-color:var(--accent)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{color:var(--faint);font:600 10.5px Inter,system-ui;text-transform:uppercase;letter-spacing:.07em;background:var(--panel-2);position:sticky;top:0}
tbody tr.row{cursor:pointer}tbody tr.row:hover{background:#1a212d}tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}.sub{display:block;color:var(--faint);font-size:11.5px}
.g{display:inline-block;min-width:38px;text-align:center;border-radius:7px;padding:2px 7px;font-weight:700;background:#2a2116;color:var(--accent-2);border:1px solid #f7a45b33}
.g.lean{background:transparent;color:var(--muted);border-color:var(--line-2);font-weight:600}.g.off{background:transparent;color:var(--faint);border:1px dashed var(--line-2);font-weight:500}
.tag{display:inline-block;border:1px solid var(--line-2);border-radius:6px;padding:0 6px;font-size:11px;color:var(--muted);margin-left:6px}
.tag.alt{border-color:#b18cff66;color:#cdb6ff}.tag.promo{border-color:#4cc76a66;color:#8fe0a3}
.pick{font-weight:600}.pick.over{color:var(--up)}.pick.under{color:var(--dn)}.pick.off{color:var(--faint);font-weight:500;text-decoration:line-through}
.offnote{display:block;color:var(--faint);font-size:11.5px}
.na{color:var(--faint);font-style:normal}
.cards{display:none}
.mcard{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;color:inherit;font:inherit;cursor:pointer}
.mcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.mcard .who b{font-size:15px}
.mcard .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.mcard .kv div{font-size:13px;font-variant-numeric:tabular-nums}.mcard .kv .k{display:block;font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.empty{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty button,.btn{background:var(--panel-2);color:var(--text);border:1px solid var(--line-2);border-radius:10px;min-height:44px;padding:0 16px;font:500 13px Inter,system-ui;cursor:pointer;margin-top:12px}
.skel{height:44px;border-radius:8px;background:linear-gradient(90deg,#141a23,#1b2330,#141a23);background-size:200% 100%;animation:sk 1.2s infinite;margin:0 0 8px}@keyframes sk{to{background-position:-200% 0}}
.match{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 14px;overflow:hidden}
.match h3{margin:0;padding:14px 16px;font:600 15px var(--display);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.match h3 span{font:12px Inter,system-ui;color:var(--muted)}.match table td{white-space:normal}.lines{display:flex;flex-direction:column;gap:6px}
.ln{display:grid;grid-template-columns:minmax(90px,auto) 58px minmax(120px,1fr) minmax(150px,auto);gap:8px;align-items:baseline;font-size:12.5px}
.ln b{font-variant-numeric:tabular-nums}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:flex-start;justify-content:center;padding:32px 12px;overflow:auto;z-index:50}
#modal.open{display:flex}.sheet{background:var(--panel);border:1px solid var(--line-2);border-radius:16px;max-width:780px;width:100%;padding:20px 20px 16px}
.sheet h2{font:600 22px var(--display);margin:2px 0 4px}.sheet h4{margin:18px 0 8px;font:600 11px Inter,system-ui;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px}.k{color:var(--faint);font-size:11.5px;display:block}
.big{font:600 20px var(--display);font-variant-numeric:tabular-nums}.sidebox{display:flex;gap:8px;flex-wrap:wrap}
.side{border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;min-width:120px}.side.off{border-style:dashed;color:var(--faint)}
.sheet ul{margin:0;padding-left:18px}.sheet li{margin:3px 0}.closebar{display:flex;justify-content:flex-end;margin-top:16px}
.gate{max-width:460px;margin:60px auto;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}.gate a{color:var(--accent-2)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}.actions .btn{margin-top:0}
.btn.primary{background:var(--accent);color:#18120e;border-color:var(--accent);font-weight:600}.btn:disabled{opacity:.45;cursor:not-allowed}
.actmsg{font-size:12.5px;color:var(--muted)}.actmsg.bad{color:#f2a36b}.actmsg.ok{color:var(--up)}
.slipleg{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.slipleg:first-child{border-top:0}
.slipleg .st{grid-column:1/-1;font-size:12.5px}.st.ok{color:var(--up)}.st.bad{color:#f2a36b}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}.panel h3{margin:0 0 8px;font:600 15px var(--display)}
.panel ul{margin:6px 0 0;padding-left:18px}.panel li{margin:3px 0;overflow-wrap:anywhere}
.sugg{border-top:1px solid var(--line);padding:10px 0 4px;margin-top:8px}.sugghead{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}.sugghead b{color:var(--text)}
.sugg .actions{margin-top:8px}.plhead{margin-top:6px}.sugg+.plhead{margin-top:16px}
@media(max-width:860px){.tablebox.board{display:none}.cards{display:block}}
@media(max-width:640px){header{padding:0 14px;height:58px;gap:10px}h1{font-size:15px}#who{display:none}.wrap{padding:14px 14px 80px}
  .bar{padding:10px;gap:8px}.bar input[type=search]{flex:1 1 100%;max-width:none;font-size:16px}.bar .seg{width:100%}.bar .seg button{flex:1}.bar select{flex:1 1 calc(50% - 4px);min-width:0;width:calc(50% - 4px)}
  #modal{padding:0;align-items:flex-start;background:var(--panel)}.sheet{border-radius:0;min-height:100vh;padding:18px 16px 24px;border:0}
  .ln{grid-template-columns:1fr 1fr;row-gap:2px;padding:6px 0;border-top:1px solid var(--line)}.ln:first-child{border-top:0}
  .match table,.match tbody,.match tr,.match td{display:block;width:100%}.match thead{display:none}.match td{border-bottom:0;padding:6px 14px}
  .match tr{border-bottom:1px solid var(--line);padding:6px 0}.match td:nth-child(1),.match td:nth-child(2){display:inline-block;width:auto;padding-bottom:0}.mcard .kv{grid-template-columns:repeat(2,1fr)}}

/* ONE_TIME_MATCHROOM_START */
/* 1time Esports / Matchroom. Shared presentation only; no forecast changes. */
:root {
  --bg:#0a0d12; --panel:#111720; --panel-2:#192330; --line:#273343;
  --line-2:#3b4d62; --text:#f3f6fa; --muted:#b1bdcc; --faint:#94a3b6;
  --accent:#ffad68; --accent-2:#ffca9f; --radius:16px;
  --display:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
body {background:radial-gradient(ellipse at 75% 0,#22324855,transparent 52%),var(--bg);color:var(--text)}
button,input,select,textarea {font-family:Inter,system-ui,sans-serif}
button,a,input,select,textarea,summary {touch-action:manipulation}
button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible {outline:3px solid var(--accent);outline-offset:3px}
[hidden] {display:none!important}
.scout-rail {width:208px;background:#0d121a;padding:28px 16px;border-right:1px solid var(--line)}
.rail-brand {font:800 22px var(--display);letter-spacing:-1px;gap:10px}
.rail-mark,.logo {background:var(--accent);box-shadow:none;border-radius:11px}
.rail-word {letter-spacing:-.8px}.rail-edition {color:var(--muted);letter-spacing:.13em;margin:13px 0 30px}
.rail-link {min-height:48px;text-decoration:none;border-radius:10px;margin:5px 0}
.rail-link.on {background:#ffad6810;border-color:#ffad6838;color:var(--accent-2)}
.wrap {margin-left:208px;max-width:1720px;padding:0 32px 100px}
header {height:72px;margin:0 -32px;padding:0 32px;background:#0a0d12f5}
header h1 {font:800 18px var(--display);text-transform:none;letter-spacing:-.5px}
header h1 em {color:var(--text)}
header .tag {font:11px var(--display);letter-spacing:.02em;text-transform:none}
.workspace-intro {padding:28px 0 22px;margin:0;align-items:center}
.workspace-intro h2 {font:700 clamp(27px,3vw,40px)/1.1 var(--display);letter-spacing:-1.2px;margin:8px 0}
.workspace-intro p {font-size:13px;max-width:640px}
.workspace-intro .eyebrow {font:600 10px var(--display);letter-spacing:.18em}
body.mode-board .workspace-intro,body.mode-slate .workspace-intro {display:flex;justify-content:space-between;padding:30px 0 24px;align-items:center}
body.mode-board:not(.scout-compact) .workspace-intro>div:first-child,body.mode-slate:not(.scout-compact) .workspace-intro>div:first-child {display:block}
.workspace-tools button {min-height:40px}
.research-strip {display:none}
.board-command>span {font:600 12px var(--display);letter-spacing:.02em;text-transform:none;color:var(--muted)}
.bbar {gap:10px;padding:16px;background:#111720;border-radius:16px;border-color:var(--line)}
#bbook {padding:0 0 12px;gap:4px}
#bbook button {min-height:42px;flex:1 1 0!important;font-size:13px;padding:10px 12px!important}
#bbook button.on,#bbook button[data-v=underdog].on,#bbook button[data-v=prizepicks].on,#bbook button[data-v=moneylines].on {background:#253347;color:#fff;border-color:#43566d}
.seg {background:#0b1119;border-color:var(--line)}
.seg button {min-height:40px}.seg button.on {background:#27374b;color:#fff}
.chipbtn,.bslip {min-height:38px}.go {background:var(--accent);color:#211207;letter-spacing:0;text-transform:none;font-weight:700}
#bsearch {min-height:44px}.bbar input[type=search] {flex-basis:240px}
.ot-summary {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
.ot-metric {border:1px solid var(--line);border-radius:13px;padding:16px 18px;background:linear-gradient(135deg,#1b2635,#111720)}
.ot-metric span {display:block;color:var(--muted);font-size:11px;margin-bottom:8px}
.ot-metric strong {font:700 27px var(--display);letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.ot-metric small {font-size:11px;color:var(--muted);margin-left:8px}
.mgroup {border:1px solid #2d3b4d;border-radius:16px;background:#101722;margin:0 0 18px}
.mgroup>summary {background:#182332;padding:20px;flex-wrap:wrap}
.mgroup>summary b {font:650 19px var(--display);letter-spacing:-.4px}
.mgroup>summary .small {color:var(--muted);font-size:12px;margin-left:21px}
.mgroup .mbody {padding:14px}
.ot-match-tools {display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin:0 0 12px}
.ot-match-tools p {margin:0;flex:1 1 340px;font-size:12px;color:var(--muted);line-height:1.7}
.ot-match-tools p b {color:var(--text)}
.ot-open-match {border:1px solid #ffad6855;border-radius:9px;min-height:42px;padding:9px 13px;background:#ffad680b;color:var(--accent-2);font:600 12px var(--display);cursor:pointer}
.ot-match-warning {padding:9px 12px;margin:0 0 12px;border:1px solid #d5a64d55;background:#d5a64d09;border-radius:9px;color:#f0cc88;font-size:12px}
.brow2 {grid-template-columns:44px minmax(0,1fr) auto;border:1px solid #293647;background:#121c28;padding:16px;border-radius:12px;gap:14px}
.brow2:hover {background:#1a283a;border-color:#5b7190}
.b2top {font-size:16px}.b2top .muted {font-size:11px;display:block;margin-top:3px}
.b2pick {font-size:15px;font-weight:500;line-height:1.7;margin-top:7px}
.b2pick b {color:var(--text)}.b2meta {font-size:12px;color:var(--muted)}
.b2ev {font-size:12px}.bslip {background:#ffad680c;color:var(--accent-2);border:1px solid #ffad6850;min-height:42px;padding:8px 12px}
.bslip:disabled {background:transparent;border-color:var(--line);color:var(--faint)}
.brow2 .gtag {background:#202d3d;border-color:#41526b;color:#edf4ff;border-radius:10px;font-size:15px}
.brow2 .g-a,.brow2 .g-ap,.brow2 .g-am {background:#173b32;color:#a4e7c9;border-color:#386d5e}
.ot-featured {padding:0!important;border:0;background:transparent;margin:18px 0 24px!important}
.ot-featured>.blist {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0}
.ot-featured .brow2 {grid-template-columns:34px minmax(0,1fr);align-content:start;background:linear-gradient(145deg,#20324a,#131d2c);border-color:#39516d}
.ot-featured .brow2 .bslip {grid-column:2;justify-self:start}.ot-featured .b2top {font-size:16px}.ot-featured .b2pick {font-size:14px}
.glegend {padding:14px;margin-top:16px;border-top:1px solid var(--line);line-height:1.8;color:var(--muted)}
.mlcard {border:1px solid var(--line);background:linear-gradient(120deg,#182332,#111720);border-radius:16px;padding:22px;margin-bottom:16px}
.mlhead b {font:650 21px var(--display);letter-spacing:-.6px}.mlhead .small {margin-top:5px}
.mlprob {font-weight:700;font-variant-numeric:tabular-nums}.mlside {border-top:1px solid var(--line);margin-top:15px;padding-top:15px}
.mlreasons {line-height:1.8}.mlcard details {border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
#studiobox {background:#111b29;border:1px solid #344763;border-radius:14px;margin:16px 0}
#studio {background:transparent}.studio-step {background:#141f2c}.studio-row>.t {font-size:12px}
.studio-bar {padding:16px}.studio-bar>b {font:600 16px var(--display)}
#f {background:linear-gradient(130deg,#1b283a,#111720);border-color:#35485f;padding:26px}
#f .workspace-section-title h2 {font-size:19px;text-transform:none;letter-spacing:-.3px}
.herocard {background:linear-gradient(120deg,#203149,#121b29)!important;border-color:#3e536d}
.hero h3 {font-family:var(--display);font-weight:750}.stat .v,.side .v {font-family:var(--display)}
.card h2 {text-transform:none;letter-spacing:0;font:650 15px var(--display);color:var(--text)}
#cardpop #popbody {border:1px solid #43536b;box-shadow:0 24px 100px #000b}
.ot-desk {color:var(--text);background:#0e1520;border:1px solid #465a75;border-radius:20px;padding:0;width:min(1120px,calc(100% - 36px));max-width:none;max-height:88dvh;overflow:auto;box-shadow:0 30px 120px #000b}
.ot-desk::backdrop {background:#03070dce;backdrop-filter:blur(5px)}
.ot-desk-head {position:sticky;top:0;z-index:2;background:#142031;padding:22px 26px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.ot-desk-head h2 {font:700 25px var(--display);letter-spacing:-.7px;margin:7px 0}
.ot-desk-head p {margin:0;font-size:12px;color:var(--muted)}
.ot-desk-content {padding:22px 26px}.ot-desk-content h3 {font:650 16px var(--display);margin:22px 0 12px}
.ot-desk-list {display:grid;gap:10px}.ot-desk-row {display:grid;grid-template-columns:130px minmax(0,1fr);gap:15px;background:#152031;border:1px solid var(--line);border-radius:12px;padding:14px}
.ot-desk-player strong {display:block;font-size:15px}.ot-desk-player small {font-size:11px;color:var(--muted)}
.ot-offers {display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.ot-offer {text-align:left;border:1px solid #36485f;border-radius:9px;background:#101924;color:var(--text);padding:12px;cursor:pointer;font:13px/1.6 var(--display)}
.ot-offer:hover {border-color:var(--accent);background:#1c2b3f}.ot-offer>span {display:block}.ot-offer small {color:var(--muted);font-size:11px}
.ot-desk-close {flex-shrink:0;min-height:44px;border:1px solid var(--line-2);border-radius:9px;padding:8px 14px;color:var(--text);background:#1c2b3e;cursor:pointer}
.ot-status {display:inline-block;border:1px solid #42526a;border-radius:6px;color:var(--muted);padding:1px 6px;font-size:10px;margin-top:5px}
/* LoL keeps its independent routing, controls, and grading rules. */
body.ot-lol .wrap {margin:0 auto;max-width:1500px;padding:28px 28px 90px}
body.ot-lol header {margin:0;padding:0 28px}
body.ot-lol .intro {margin:0 0 24px}.ot-lol .intro h2 {font:700 34px var(--display);letter-spacing:-1px}

  const parts = Object.entries(D.feeds || {}).map(([k, v]) => `<span>${esc(k)} lines checked <b>${when(v)}</b></span>`);
  return parts.join("");
}
function holdBanner() {   // lc-1: one plain-fact banner while LoL letters are held
  return D && D.letter_hold && D.letter_hold.banner ? `<div class="banner lhold" role="status">${esc(D.letter_hold.banner)}</div>` : "";
}
function staleBanner() {
  const out = [];
  for (const [k, v] of Object.entries(D.feeds || {})) { const m = ago(v); if (m != null && m > 15) out.push(`${esc(k)} lines were last checked ${m} minutes ago.`); }
  const b = ago(D.at); if (b != null && b > 25) out.push(`This board was last updated ${b} minutes ago.`);
  return out.length ? `<div class="banner" role="status">${out.join(" ")}</div>` : "";
}
function seg(id, cur, opts) { return `<div class="seg" id="${id}" role="group">${opts.map(([v, l]) => `<button type="button" data-v="${v}" class="${cur === v ? "on" : ""}" aria-pressed="${cur === v}">${l}</button>`).join("")}</div>`; }
function overview() {
  const rs = rows(), available = rs.filter(playable), matches = new Set(rs.map(matchKey));
  return `<div class="overview"><div><strong>${rs.length}</strong><span>Matching lines</span></div><div><strong>${matches.size}</strong><span>Matches</span></div><div title="Offered, upcoming and checked within 15 minutes"><strong>${available.filter(x => x.pick_side === "Over").length}</strong><span>Ready Overs</span></div><div title="Offered, upcoming and checked within 15 minutes"><strong>${available.filter(x => x.pick_side === "Under").length}</strong><span>Ready Unders</span></div></div>
    <div class="results-heading"><div><h3>Your research board</h3><span class="small muted">Projections and model chances · select a player to compare and build</span></div>${seg("layout", F.layout, [["cards", "Cards"], ["table", "Table"]])}</div>`;
}
function render() {
  shownD = D; shownSlip = SLIP.legs.length;
  const ae = document.activeElement, typing = ae && ae.id === "q" ? [ae.selectionStart] : null;   // a redraw (typing, the poll) keeps the search box focused
  const y = window.scrollY, tb = $(".tablebox.board"), sl = tb ? tb.scrollLeft : 0;
  const ms = new Map();
  for (const x of D.rows || []) ms.set(matchKey(x), `${matchName(x)} · ${new Date(x.start).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"})}`);
  for (const t of D.match_tables || []) if (!ms.has(`${t.start}|${t.teams}`)) ms.set(`${t.start}|${t.teams}`, `${t.teams} · ${new Date(t.start).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"})}`);
  if (F.match !== "all" && !ms.has(F.match)) F.match = "all";
  let h = `<div class="intro"><div><div class="eyebrow">League of Legends · Underdog + PrizePicks</div><h2>Read the match. Find your pick.</h2><p>Every posted kills, assists and deaths line with the model's projection for the exact games in the prop, the chance of each side, and the grade.</p></div><div class="feeds">${feedsLine()}</div></div>${holdBanner()}${staleBanner()}${NOTE ? `<div class="banner" role="status">${esc(NOTE)}</div>` : ""}`;
  NOTE = null;
  h += `<div class="workspace-nav">${seg("v", F.view, [["board", "Board"], ["tables", "Compare books"], ["slip", `Slip${SLIP.legs.length ? " (" + SLIP.legs.length + ")" : ""}`]])}</div><div class="bar ${filtersOpen ? "filters-open" : ""}">${seg("p", F.plat, [["all", "All books"], ["underdog", "Underdog"], ["prizepicks", "PrizePicks"]])}
    <button type="button" class="btn filter-toggle" id="filtertoggle" aria-expanded="${filtersOpen}">${filtersOpen ? "Fewer filters" : "More filters"}${[F.match, F.scope, F.type, F.floor].filter(v => v !== "all").length ? " · filters active" : ""}</button>
    <select id="s" aria-label="Prop"><option value="all">All props</option><option value="kills">Kills</option><option value="assists">Assists</option><option value="deaths">Deaths</option></select>
    <select id="m" aria-label="Match"><option value="all">All matches</option>${[...ms].map(([k, l]) => `<option value="${esc(k)}">${esc(l)}</option>`).join("")}</select>
    ${F.view !== "slip" ? `<select id="scope" aria-label="Map scope"><option value="all">All map scopes</option>${[...new Set((D.rows || []).map(x => x.scope).concat((D.match_tables || []).flatMap(t => t.markets.map(m => m.scope))))].sort().map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("")}</select>
    <select id="side" aria-label="Model side"><option value="all">Overs + Unders</option><option value="Over">Overs</option><option value="Under">Unders</option></select><input type="search" id="q" placeholder="Player or team" aria-label="Search a player or team" autocomplete="off" value="${esc(F.q || "")}">` : ""}
    ${F.view === "board" ? `<select id="t" aria-label="Line type"><option value="all">All line types</option><option value="standard">Standard lines</option><option value="alt">Goblin / Demon / adjusted</option></select>
    <select id="g" aria-label="Grade floor">${FLOORS.map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select>
    <select id="o" aria-label="Sort"><option value="start">Sort: start time</option><option value="grade">Sort: best grade</option><option value="chance">Sort: chance</option></select>
    <label class="chk"><input type="checkbox" id="pl" ${F.playable ? "checked" : ""}> Offered picks only</label>` : ""}</div>`;
  $("#app").innerHTML = h + (F.view === "board" ? overview() + boardView() : F.view === "slip" ? slipView() : tablesView());
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { SLIP.legs.splice(+b.dataset.rm, 1); saveSlip(); CHECK = {}; render(); });
  if ($("#clearslip")) $("#clearslip").onclick = () => { SLIP.legs = []; saveSlip(); CHECK = {}; render(); };
  if ($("#copyslip")) $("#copyslip").onclick = copySlip;
  if (PPL.on && $("#openslip")) $("#openslip").onclick = () => openSlip($("#openslip").dataset.open);
  document.querySelectorAll("[data-send]").forEach(b => b.onclick = () => sendSuggested(b.dataset.send));
  $("#s").value = F.stat; $("#m").value = F.match; if ($("#t")) { $("#t").value = F.type; $("#o").value = F.sort; $("#g").value = F.floor; }
  const set = (k, v) => { F[k] = v; visibleLimit = 48; save(); render(); };
  $("#filtertoggle").onclick = () => { filtersOpen = !filtersOpen; render(); };
  if ($("#morelines")) $("#morelines").onclick = () => { visibleLimit += 48; render(); };
  for (const id of ["scope", "side"]) if ($("#" + id)) { $("#" + id).value = F[id]; $("#" + id).onchange = e => set(id, e.target.value); }
  if ($("#layout")) $("#layout").onclick = e => { const b = e.target.closest("button"); if (b) set("layout", b.dataset.v); };
  const qi = $("#q");
  if (qi) {
    qi.oninput = e => { F.q = e.target.value; save(); render(); };       // redraw as the member types
    if (typing) { qi.focus(); try { qi.setSelectionRange(typing[0], typing[0]); } catch {} }   // ... keeping the cursor in the box
  }
  if ($("#g")) $("#g").onchange = e => set("floor", e.target.value);
  for (const [id, k] of [["#v", "view"], ["#p", "plat"]]) $(id).onclick = e => { const b = e.target.closest("button"); if (b) set(k, b.dataset.v); };
  $("#s").onchange = e => set("stat", e.target.value); $("#m").onchange = e => set("match", e.target.value);
  if ($("#t")) { $("#t").onchange = e => set("type", e.target.value); $("#o").onchange = e => set("sort", e.target.value); $("#pl").onchange = e => set("playable", e.target.checked); }
  const r = $("#reset"); if (r) r.onclick = () => { F = Object.assign({}, DEF, {view: F.view}); save(); render(); };
  const go = document.querySelector("[data-go]"); if (go) go.onclick = () => set("view", go.dataset.go);
  document.querySelectorAll("[data-k]").forEach(el => {
    el.onclick = () => card(el.dataset.k, el);
    if (el.tagName === "TR") el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); card(el.dataset.k, el); } };
  });
  ctWire(); ctFloat();
  const tb2 = $(".tablebox.board"); if (tb2) tb2.scrollLeft = sl;
  window.scrollTo(0, y);
}
let GATED = false;
async function load(first) {
  let r;
  try { r = await fetch("/api/lol/board", {cache: "no-cache"}); } catch { r = null; }
  if (r && r.status === 401) { GATED = true; gate(await r.json().catch(() => ({}))); return false; }
  if (!r || !r.ok) {
    if (first || !D) $("#app").innerHTML = `<div class="empty"><b>The LoL board could not be loaded.</b><p class="small">${r ? "The server answered " + r.status + "." : "No connection."}</p><button type="button" id="retry">Try again</button></div>`;
    const b = $("#retry"); if (b) b.onclick = () => load(true);
    return false;
  }
  let d;
  try { d = await r.json(); } catch { d = null; }
  if (!d || typeof d !== "object") {
    if (first || !D) $("#app").innerHTML = `<div class="empty"><b>The LoL board could not be loaded.</b><p class="small">Try again in a moment.</p><button type="button" id="retry">Try again</button></div>`;
    const b = $("#retry"); if (b) b.onclick = () => load(true);
    return false;
  }
  D = d;
  if (openRow == null) render();
  if (first) { try { const y = +sessionStorage.getItem(SKEY); if (y) window.scrollTo(0, y); } catch {} }
  return true;
}
function gate(s) {
  $("#app").innerHTML = `<div class="gate"><h2>Members only</h2><p class="muted">Sign in with Whop to see the LoL board.</p><p><a href="/auth/login">Sign in</a>${s.upgrade ? ` · <a href="${esc(s.upgrade)}">Join on Whop</a>` : ""}</p></div>`;
}
document.addEventListener("keydown", e => {
  if ($("#ctmodal").classList.contains("open")) { if (e.key === "Escape") ctClose(); return; }
  if (!$("#modal").classList.contains("open")) return;
  if (e.key === "Escape") closeCard();
  if (e.key === "Tab") {
    const els = [...$("#card").querySelectorAll('button:not(:disabled),a[href],input,select,summary,[tabindex="0"]')].filter(el => el.getClientRects().length);
    const first = els[0], last = els[els.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeCard(); });
$("#ctmodal").addEventListener("click", ctClick);
$("#ctbtn").addEventListener("click", ctOpen);
window.addEventListener("scroll", () => { try { sessionStorage.setItem(SKEY, String(window.scrollY)); } catch {} }, {passive: true});
(async () => {
  const s = await fetch("/auth/me").then(r => r.json()).catch(() => ({}));
  if (s.required && !s.member) { gate(s); return; }
  if (s.name) $("#who").innerHTML = `${esc(s.name)} · <a href="/auth/logout">Sign out</a>`;
  if (s.pp_open_link === true) PPL.on = true;           // PP_OPEN_LINK owner switch (default off)
  if (await load(true)) openLinked();
  if (!GATED) poll();
})();
// a shared link (/lol?line=<key>) opens that line's card; a line no longer on the board says so and opens nothing
function openLinked() {
  let k = null; try { k = new URLSearchParams(location.search).get("line"); } catch {}
  if (!k) return;
  if ((D.rows || []).some(r => r.key === k)) card(k);
  else { NOTE = "That line is no longer on the board."; setUrl(null); render(); }
}
// refresh every 2 minutes plus a random 0-20 s (700 members never ask together), skipped while the tab is hidden;
// the browser re-checks its copy with the server (ETag), so an unchanged board costs a 304 with no body
function poll() {
  setTimeout(async () => { try { if (document.visibilityState !== "hidden" && !GATED) await load(false); } catch {} finally { if (!GATED) poll(); } }, 120000 + Math.floor(Math.random() * 20000));
}
