<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 Prop Grader</title>
<style>
:root{
  --bg:#0b0e13; --panel:#131821; --panel-2:#1a2130; --line:#252e3f;
  --text:#e8ecf3; --muted:#8b95a8; --faint:#5d6679;
  --accent:#4f8cff;
  --good:#2fbf71; --good-bg:rgba(47,191,113,.12);
  --warn:#f0b429; --warn-bg:rgba(240,180,41,.12);
  --bad:#ef5a5a;  --bad-bg:rgba(239,90,90,.12);
  --radius:14px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
header h1{font-size:18px;margin:0;letter-spacing:.2px}
header span{color:var(--muted);font-size:13px}

/* search */
form{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;
  display:grid;grid-template-columns:1fr 120px;gap:10px}
.field{position:relative;display:flex;flex-direction:column;gap:5px}
label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
input,select{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:11px 12px;font:inherit;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.row2{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:0;color:var(--muted);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.row2 .field{flex:0 0 150px}
.go{margin-left:auto;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 22px;
  font:600 15px system-ui,sans-serif;cursor:pointer}
.go:disabled{opacity:.5;cursor:wait}
.suggest{position:absolute;top:100%;left:0;right:0;z-index:5;margin-top:4px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;display:none}
.suggest div{padding:9px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.suggest div:hover,.suggest div.hl{background:var(--line)}
.suggest small{color:var(--muted)}
.cc{font:600 11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 4px}

/* states */
.status{margin-top:18px;padding:18px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.status.err{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}

/* result */
#out{margin-top:18px;display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{margin:0 0 12px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.badge{width:96px;height:96px;border-radius:18px;display:grid;place-items:center;font:800 40px system-ui,sans-serif}
.g-good{background:var(--good-bg);color:var(--good);border:1px solid var(--good)}
.g-warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.g-bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.g-scout{background:var(--panel-2);color:var(--muted);border:1px dashed var(--line)}
.hero > div{min-width:0}
.hero h3{margin:0;font-size:22px}
.hero .sub{color:var(--muted);margin-top:2px}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin:6px 6px 0 0}
.pill.good{color:var(--good);border-color:var(--good)} .pill.bad{color:var(--bad);border-color:var(--bad)} .pill.warn{color:var(--warn);border-color:var(--warn)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.side{background:var(--panel-2);border-radius:10px;padding:10px 12px}
.side .k{font-size:12px;color:var(--muted)} .side .v{font:700 20px system-ui,sans-serif}
.bar{height:6px;background:var(--line);border-radius:99px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.value{margin-top:12px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;display:grid;gap:4px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.stat{background:var(--panel-2);border-radius:10px;padding:9px 11px}
.stat .k{font-size:11.5px;color:var(--muted)} .stat .v{font:600 17px system-ui,sans-serif;margin-top:1px}
.stat .n{font-size:11.5px;color:var(--faint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.5px}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.hit{color:var(--good);font-weight:700} .miss{color:var(--bad);font-weight:700}
.muted{color:var(--muted)} .small{font-size:12.5px}
ul.flags{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px} ul.flags li{margin:3px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0} .kv span:first-child{color:var(--muted);flex:0 0 auto}
.kv > span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.card{min-width:0} .pill{max-width:100%;white-space:normal}
.mates{display:flex;flex-direction:column;gap:6px}
.mate{display:grid;grid-template-columns:90px 1fr 44px;gap:8px;align-items:center;font-size:13.5px}
.mate.me{font-weight:700}
.mate .bar{margin:0} .mate.me .bar i{background:var(--good)}
.scroll{overflow-x:auto}
@media (max-width:640px){
  form{grid-template-columns:1fr 96px}
  .row2 .field{flex:1 1 130px}
  .go{width:100%;margin-left:0}
  .two{grid-template-columns:1fr}
  .badge{width:78px;height:78px;font-size:32px}
}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>CS2 Prop Grader</h1><span>Maps 1–2 · v7.3</span></header>

  <form id="f" autocomplete="off">
    <div class="field">
      <label for="player">Player</label>
      <input id="player" placeholder="e.g. ZywOo" required>
      <div class="suggest" id="sug"></div>
    </div>
    <div class="field">
      <label for="line">Line</label>
      <input id="line" inputmode="decimal" placeholder="27.5" required>
    </div>
    <div class="row2">
      <div class="field" style="flex:0 0 auto">
        <label>Prop</label>
        <div class="seg" id="prop"><button type="button" data-v="kills" class="on">Kills</button><button type="button" data-v="hs">Headshots</button></div>
      </div>
      <div class="field">
        <label for="lt">Line type</label>
        <select id="lt"><option value="standard">Standard</option><option value="goblin">Goblin</option><option value="demon">Demon</option></select>
      </div>
      <button class="go" id="go">Grade</button>
    </div>
  </form>

  <div id="status" class="status" hidden></div>
  <div id="out"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x, d = 1) => x == null ? "–" : (x * 100).toFixed(d) + "%";
const num = (x, d = 2) => x == null ? "–" : Number(x).toFixed(d);
const mapName = m => m ? m.replace(/^de_/, "").replace(/^./, c => c.toUpperCase()) : "–";
const gClass = g => ["A+","A","A-"].includes(g) ? "g-good" : ["B+","B"].includes(g) ? "g-warn" : "g-bad";
const when = s => { if (!s) return "–"; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString([], {weekday:"short", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}); };

let prop = "kills", slug = null;
$("#prop").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  prop = b.dataset.v; [...$("#prop").children].forEach(x => x.classList.toggle("on", x === b)); };

// ---------- suggestions
let t, sel = -1, items = [];
$("#player").addEventListener("input", () => {
  slug = null; clearTimeout(t);
  const q = $("#player").value.trim();
  if (q.length < 2) return hideSug();
  t = setTimeout(async () => {
    try {
      const r = await fetch("/api/search?q=" + encodeURIComponent(q)).then(r => r.json());
      items = r.results || []; sel = -1;
      // a late reply must not reopen the list once the user has moved on
      if (!items.length || document.activeElement !== $("#player") || $("#player").value.trim() !== q) return hideSug();
      $("#sug").innerHTML = items.map((p, i) => `<div data-i="${i}"><span class="cc">${esc(p.country || "–")}</span><span>${esc(p.nick)}</span><small>${esc(p.name)}</small></div>`).join("");
      $("#sug").style.display = "block";
    } catch { hideSug(); }
  }, 250);
});
$("#player").addEventListener("keydown", e => {
  if ($("#sug").style.display !== "block") return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
    [...$("#sug").children].forEach((d, i) => d.classList.toggle("hl", i === sel));
  } else if (e.key === "Enter" && sel >= 0) { e.preventDefault(); pick(sel); }
  else if (e.key === "Escape") hideSug();
});
$("#sug").onmousedown = e => { const d = e.target.closest("[data-i]"); if (d) pick(+d.dataset.i); };
$("#player").addEventListener("blur", () => setTimeout(hideSug, 120));
function pick(i) { $("#player").value = items[i].nick; slug = items[i].slug; hideSug(); $("#line").focus(); }
function hideSug() { $("#sug").style.display = "none"; }

// ---------- grade
$("#f").onsubmit = async e => {
  e.preventDefault(); hideSug();
  const player = $("#player").value.trim(), line = $("#line").value.trim().replace(",", ".");
  if (!player || !line) return;
  const qs = new URLSearchParams({player, line, prop, line_type: $("#lt").value});
  if (slug) qs.set("slug", slug);
  $("#go").disabled = true; $("#out").innerHTML = "";
  const st = $("#status"); st.hidden = false; st.className = "status";
  const t0 = Date.now();
  const tick = () => st.innerHTML = `<span class="spin"></span>Grading ${esc(player)} ${esc(line)} ${prop === "hs" ? "headshots" : "kills"} · ${Math.round((Date.now() - t0) / 1000)}s<div class="small" style="margin-top:6px">Players in upcoming matches are pre-loaded and take a few seconds. Anyone else takes up to a minute the first time.</div>`;
  tick(); const iv = setInterval(tick, 1000);
  try {
    const r = await fetch("/api/grade?" + qs);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Something went wrong");
    st.hidden = true; render(d);
  } catch (err) {
    st.className = "status err"; st.textContent = err.message;
  } finally { clearInterval(iv); $("#go").disabled = false; }
};

function render(d) {
  const g = d.grade || {}, v = d.verdict || {}, pb = d.player_block || {}, o = pb.overall || {};
  const nm = d.next_match, od = d.odds, hh = d.h2h, fc = d.faceit, det = g.detail || {};
  const stat = g.prop === "hs" ? "headshots" : "kills";
  // edge and the vig note follow the side we recommend (More when nothing is playable)
  const edgeSide = v.side || "More";
  const implied = g.market?.pp_implied_more;
  const edge = implied == null ? null : (edgeSide === "Less" ? g.p_less : g.p_more) - implied;
  let h = "";

  // ---- headline
  const head = v.state === "SCOUT" ? `SCOUT · leans ${v.side} ${g.line}`
    : v.side ? `${v.side} ${g.line}` : g.status === "NO GRADE" ? "No grade" : "No play";
  const gateStop = !("p_more" in g);   // stopped by a gate - the reason shows as a pill instead
  const sub = v.side ? `${pct(v.p)} chance · ${v.units}U · ${esc(v.confidence)} confidence<div class="small muted" style="margin-top:4px">${esc(v.reason || "")}</div>`
    : gateStop ? "" : esc(v.reason || "");
  h += `<section class="card"><div class="hero">
    <div class="badge ${v.state === "SCOUT" ? "g-scout" : gClass(v.grade)}">${esc(g.status === "NO GRADE" ? "–" : v.state === "SCOUT" ? "S" : v.grade || "C")}</div>
    <div><h3>${esc(head)}</h3>
      <div class="sub">${esc(pb.player?.nick || "")} · ${pb.standin_for ? `${esc(pb.current_team || "")} → <b>stand-in for ${esc(pb.standin_for)}</b>` : esc(pb.current_team || "")} · ${g.line} ${stat} · ${esc(g.line_type || "")}</div>
      <div class="sub">${sub}</div>
      ${gateStop ? `<span class="pill bad">${esc(g.reason || g.status)}</span>` : ""}
      ${g.form_fight ? `<span class="pill warn">FORM FIGHT - last 10 matches disagree, confidence halved</span>` : ""}
      ${pb.standin_for ? `<span class="pill warn">STAND-IN for ${esc(pb.standin_for)} · max 0.5U</span>` : ""}
      ${g.tape_fight ? `<span class="pill warn">TAPE FIGHT - recent record at this line disagrees · 0U</span>` : ""}
      ${g.market_quality && g.market_quality !== "HARD" && v.state !== "SCOUT" ? `<span class="pill">${g.market_quality === "SOFT" ? "SOFT BOOK" : "NO MARKET"} · max 1U</span>` : ""}
      ${g.market?.note_line ? `<span class="pill warn">${esc(g.market.note_line)}</span>` : ""}
    </div></div>`;
  if ("p_more" in g) {
    h += `<div class="sides">
      <div class="side"><div class="k">More · grade ${esc(g.grade)} · ${g.units || 0}U</div><div class="v">${pct(g.p_more)}</div><div class="bar"><i style="width:${g.p_more*100}%"></i></div></div>
      <div class="side"><div class="k">Less · grade ${esc(g.grade_less)} · ${g.units_less || 0}U</div><div class="v">${pct(g.p_less)}</div><div class="bar"><i style="width:${g.p_less*100}%"></i></div></div>
    </div>
    ${d.simulation ? `<div class="small muted" style="margin-top:8px">Match simulation (${d.simulation.runs.toLocaleString()} runs): <b>${pct(d.simulation.p_more)} More</b> · average ${d.simulation.mean} · weight 0 (tested: the grade's curve was as accurate and better calibrated)</div>` : ""}
    <div class="stats" style="margin-top:10px">
      <div class="stat"><div class="k">Base</div><div class="v">${num(g.lambda_base,1)}</div><div class="n">KPR × 44${g.prop === "hs" ? " × HS%" : ""}</div></div>
      <div class="stat"><div class="k">Win/loss factor</div><div class="v">×${num(det.outcome_mult,3)}</div><div class="n">${pct(det.p_win,0)} to win</div></div>
      <div class="stat"><div class="k">Projection</div><div class="v">${num(g.lambda_final,1)}</div><div class="n">${stat}, Maps 1–2</div></div>
      <div class="stat"><div class="k">Line</div><div class="v">${g.line}</div><div class="n">fair ${g.value ? g.value.fair_line : "–"}</div></div>
      <div class="stat"><div class="k">Edge</div><div class="v">${(g.lambda_final - g.line > 0 ? "+" : "") + (g.lambda_final - g.line).toFixed(1)}</div><div class="n">projection − line</div></div>
      <div class="stat"><div class="k">Last 10</div><div class="v">${pb.recent_form?.avg_total ?? "–"}</div><div class="n">median ${pb.recent_form?.median_total ?? "–"} · ${pb.recent_form?.overs ?? "–"}/${pb.recent_form?.matches ?? "–"} over</div></div>
    </div>`;
  }
  h += `</section>`;

  // ---- match
  h += `<section class="card"><h2>Match</h2>`;
  if (nm) h += `<div class="kv"><span>Opponent</span><span>${esc(nm.opponent)}${d.opponent_nationality?.id ? ` <span class="muted small">(${esc(d.opponent_nationality.label)})</span>` : ""}</span></div>
    <div class="kv"><span>Starts</span><span>${when(nm.start)}</span></div>
    <div class="kv"><span>Event</span><span>${esc(nm.event || "–")}</span></div>
    <div class="kv"><span>Maps 1–2</span><span>${nm.maps?.length ? nm.maps.slice(0,2).map(mapName).join(" · ")
      : pb.map_prediction ? "Predicted from both teams' vetoes (below)" : "Not announced yet – using all-maps stats"}</span></div>`;
  if (!nm?.maps?.length && pb.map_prediction) {
    const top = o => Object.entries(o).slice(0, 3).map(([m, p]) => `${mapName(m)} ${pct(p, 0)}`).join(" · ");
    h += `<div class="kv"><span>Map 1 (predicted)</span><span>${esc(top(pb.map_prediction.map1))}</span></div>
      <div class="kv"><span>Map 2 (predicted)</span><span>${esc(top(pb.map_prediction.map2))}</span></div>`;
  }
  else h += `<div class="muted">No upcoming match found for ${esc(pb.current_team || "this team")}.</div>`;
  if (od?.found) {
    h += `<div class="kv"><span>Win chance (Polymarket)</span><span>${esc(od.team)} ${pct(od.team_prob)} · ${esc(od.opponent)} ${pct(od.opp_prob)}</span></div>`;
    if (od.maps?.map1 || od.maps?.map2) h += `<div class="kv"><span>Map winners</span><span>${["map1","map2"].filter(k=>od.maps[k]).map(k=>`${k.replace("map","Map ")}: ${pct(od.maps[k].team_prob,0)}`).join(" · ")}</span></div>`;
    for (const f of od.flags || []) h += `<div class="small muted" style="margin-top:6px">⚠ ${esc(f)}</div>`;
  } else if (od) h += `<div class="kv"><span>Win chance</span><span class="muted">${esc(od.note)}</span></div>`;
  if (det.p_win != null) h += `<div class="kv"><span>Rounds used</span><span>${det.rounds}${det.stomp ? " (stomp)" : ""}</span></div>`;
  h += `</section>`;

  // ---- stats + role
  const mates = Object.entries(pb.teammate_ratings || {}).map(([n, r]) => ({n, r}));
  mates.push({n: pb.player?.nick, r: o.rating, me: true});
  mates.sort((a, b) => (b.r || 0) - (a.r || 0));
  const maxR = Math.max(...mates.map(m => m.r || 0), 1.2);
  const rf = pb.recent_form || {};
  h += `<section class="card"><h2>Stats · Maps 1–2 only · ${esc((o.window || "").replace("last_", "last ").replace(/_/g, " "))} · ${o.maps_played ?? "–"} maps</h2>
    <div class="stats">
      <div class="stat"><div class="k">Kills / round</div><div class="v">${num(o.kpr,3)}</div><div class="n">${o.form_blend ? "50% 3m · 30% 6m · 20% 12m" : ""}</div></div>
      ${o.form_windows ? ["3m", "6m", "12m"].map(k => o.form_windows[k] ? `<div class="stat"><div class="k">${k} KPR · HS%</div><div class="v">${num(o.form_windows[k].kpr,3)}</div><div class="n">${o.form_windows[k].hs_pct ?? "–"}% HS · ${o.form_windows[k].maps} maps${o.form_windows[k].maps < 10 ? " (dropped)" : ""}</div></div>` : "").join("") : ""}
      <div class="stat"><div class="k">Headshot %</div><div class="v">${o.hs_pct ?? "–"}%</div></div>
      <div class="stat"><div class="k">Rating</div><div class="v">${num(o.rating)}</div><div class="n">HLTV-style · all maps</div></div>
      <div class="stat"><div class="k">KAST</div><div class="v">${pb.kast ?? "–"}%</div></div>
      <div class="stat"><div class="k">Deaths / round</div><div class="v">${num(o.dpr,3)}</div></div>
      <div class="stat"><div class="k">ADR</div><div class="v">${o.adr ?? "–"}</div></div>
      ${rf.kpr_recent != null ? `<div class="stat"><div class="k">Recent KPR</div><div class="v">${num(rf.kpr_recent,3)}</div><div class="n">${rf.trend_pct_vs_window > 0 ? "+" : ""}${rf.trend_pct_vs_window}% vs window</div></div>` : ""}
    </div>`;
  if ((pb.per_map || []).length) h += `<div class="stats" style="margin-top:8px">${pb.per_map.map(m => `<div class="stat"><div class="k">${mapName(m.map)} KPR</div><div class="v">${num(m.kpr,3)}</div><div class="n">${m.maps_played ?? 0} maps</div></div>`).join("")}</div>`;
  h += `</section>`;

  h += `<div class="two"><section class="card"><h2>Role · ${esc(det.role || "–")}${pb.team_kill_share != null ? ` · ${pct(pb.team_kill_share)} of team kills (weight 0)` : ""}</h2><div class="mates">
    ${mates.map(m => `<div class="mate ${m.me ? "me" : ""}"><span>${esc(m.n)}</span><div class="bar"><i style="width:${(m.r || 0) / maxR * 100}%"></i></div><span class="num">${num(m.r)}</span></div>`).join("")}
    </div></section>
    <section class="card"><h2>Checks</h2>
      <div class="kv"><span>Roster</span><span>${pb.roster_confirmed ? "Confirmed" : "Not confirmed"}${pb.is_standin ? " · stand-in" : ""}</span></div>
      <div class="kv"><span>AWP</span><span>${esc(pb.awp_note || "–")}</span></div>
      <div class="kv"><span>IGL</span><span>${pb.is_igl ? "Yes (−15%)" : "No"}</span></div>
      ${pb.trade_pr != null ? `<div class="kv"><span>Trade kills</span><span>${num(pb.trade_pr,3)}/round · ${g.prop === "kills" ? `projection ×${num(det.trade_mult,3)}` : "weight 0 on headshots"}</span></div>` : ""}
      ${pb.opening?.kills_per_round != null ? `<div class="kv"><span>Opening kills</span><span>${num(pb.opening.kills_per_round,3)}/round · ${pct(pb.opening.duel_win,0)} duels won · weight 0</span></div>` : ""}
      ${o.flags?.length ? `<div class="kv"><span>Sample</span><span>${esc(o.flags.join("; "))}</span></div>` : ""}
    </section></div>`;

  // ---- H2H
  h += `<section class="card"><h2>Head-to-head vs ${esc(hh?.opponent_query || nm?.opponent || "opponent")}${hh?.hit_rate != null ? ` · ${pct(hh.hit_rate,0)} over ${hh.line}` : ""}</h2>`;
  if (d.regional_note) h += `<div class="small muted" style="margin-bottom:8px">${esc(d.regional_note)}</div>`;
  if (hh?.series?.length) {
    h += `<div class="scroll"><table><thead><tr><th>Date</th><th>Opponent</th><th>Maps 1–2</th><th class="num">${stat}</th><th>Result</th><th></th></tr></thead><tbody>`;
    for (const s of hh.series) h += `<tr><td class="num" style="text-align:left">${esc(s.date)}</td><td>${esc(s.opponent)}${s.regional ? ` <span class="pill">regional</span>` : ""}</td>
      <td class="small">${s.maps.map(mapName).join(" · ")}</td><td class="num">${s.values.join(" + ")} = <b>${s.total}</b></td>
      <td>${esc(s.result)}</td><td class="${s.total > g.line ? "hit" : "miss"}">${s.total > g.line ? "Over" : "Under"}</td></tr>`;
    h += `</tbody></table></div><div class="small muted" style="margin-top:8px">${esc(g.h2h || "")}</div>`;
    if (g.flags?.some(f => f.startsWith("0 units: H2H vs TAPE"))) h += `<div class="small" style="margin-top:4px;color:var(--warn)">H2H vs TAPE: head-to-head and last 10 disagree about this line → 0U</div>`;
  } else h += `<div class="muted">No previous series found.</div>`;
  h += `</section>`;

  // ---- recent form: last 10 matches, Maps 1-2
  h += `<section class="card"><h2>Last ${rf.matches ?? 10} matches · Maps 1–2${rf.hit_rate != null ? ` · over ${g.line} in ${rf.overs}/${rf.matches} (${pct(rf.hit_rate,0)})` : ""}</h2>`;
  if (rf.series?.length) {
    h += `<div class="scroll"><table><thead><tr><th>Date</th><th>Opponent</th><th>Maps 1–2</th><th class="num">${stat}</th><th>Result</th><th></th></tr></thead><tbody>`;
    for (const s of rf.series) h += `<tr><td class="num" style="text-align:left">${esc(s.date)}</td><td>${esc(s.opponent)}</td>
      <td class="small">${s.maps.map(mapName).join(" · ")}</td><td class="num">${s.values.join(" + ")} = <b>${s.total}</b></td>
      <td>${esc(s.result)}</td><td class="${s.total > g.line ? "hit" : "miss"}">${s.total > g.line ? "Over" : "Under"}</td></tr>`;
    h += `</tbody></table></div><div class="small muted" style="margin-top:8px">Average ${rf.avg_total} · median ${rf.median_total} ${stat} on Maps 1–2 · weight in the projection: 0 (tested - his 3-month numbers already include these matches)</div>`;
  } else h += `<div class="muted">No recent matches with two maps.</div>`;
  h += `</section>`;

  // ---- FACEIT
  h += `<section class="card"><h2>FACEIT form</h2>`;
  h += fc ? `<div class="kv"><span>Account</span><span>${esc(fc.nickname)} · lvl ${fc.level} · ${fc.elo} elo</span></div>
      <div class="kv"><span>Last ${fc.recent_n} games</span><span>${fc.avg_kills} kills · KPR ${fc.kpr}</span></div>
      <div class="kv"><span>HS%</span><span>${fc.avg_hs_pct}%</span></div>` : `<div class="muted">No confirmed FACEIT account.</div>`;
  h += `</section>`;

  // ---- flags
  const flags = [...(g.flags || [])];
  if (v.side && v.p < 0.68) flags.push(`${v.side} is below A- (68%) - near the vig line, no real edge`);
  if (flags.length) h += `<section class="card"><h2>Notes</h2><ul class="flags">${flags.map(f => `<li>${esc(f)}</li>`).join("")}</ul></section>`;
  h += `<div class="small muted" style="text-align:center">Data: BO3.gg · Polymarket · FACEIT · Not financial advice</div>`;
  $("#out").innerHTML = h;
}
</script>
</body>
</html>
