<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grader diagnostics</title>
<style>
:root{--bg:#0b0f15;--panel:#121925;--line:#243041;--text:#e6edf3;--muted:#8b98a9;--up:#3fb950;--dn:#f0883e}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 4px}h2{font-size:15px;margin:18px 0 8px}
.muted{color:var(--muted)}.small{font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
select,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button.on{border-color:#ff7a1a;color:#ff7a1a}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.flag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin:2px;font-size:12px}

/* Scout diagnostics workspace */
:root{--bg:#090d14;--panel:#111b29;--line:#293950;--text:#eef4fc;--muted:#a4b4ca}
*{box-sizing:border-box}body{background:radial-gradient(ellipse at 95% 0,#1c314d66,transparent 45%),var(--bg);font-family:Inter,system-ui,sans-serif;line-height:1.65}.wrap{max-width:1440px;padding:32px}
.diag-nav{display:flex;justify-content:space-between;gap:16px;padding:0 0 24px;border-bottom:1px solid var(--line);margin-bottom:30px;color:#ffb477;font-size:11px;font-weight:700;letter-spacing:.15em}.diag-nav a{color:var(--muted);text-decoration:none;letter-spacing:0;font-size:13px}
.diag-eyebrow{font:11px ui-monospace,monospace;letter-spacing:.15em;color:#ffb477;text-transform:uppercase}h1{font-size:42px;line-height:1.15;letter-spacing:-1.5px;margin:12px 0 16px}h2{font-size:20px;margin:32px 0 14px;color:var(--text);letter-spacing:-.3px}
.diag-lead{font-size:14px;max-width:830px;margin-bottom:28px}.bar{gap:10px;margin:14px 0;padding:16px;background:#111b29;border:1px solid var(--line);border-radius:14px}
select,button{font:inherit;font-size:12px;padding:11px 14px;border-radius:9px;background:#0c1420;min-height:42px}button{cursor:pointer}button.on{background:#ff8c4215;border-color:#ff8c42;color:#ffb477}button:hover,select:hover{border-color:#647792}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #ffb477;outline-offset:3px}
#gen{margin-left:auto;font:11px ui-monospace,monospace}#out{padding-top:16px}.scroll{border:1px solid var(--line);border-radius:12px;background:#0e1723;margin:14px 0;scrollbar-color:#455772 #101722}th{background:#19263a;font-size:10px;text-transform:uppercase;letter-spacing:.07em;padding:13px}td{padding:12px 13px;font-variant-numeric:tabular-nums}tbody tr:hover{background:#1c2a3f66}.card{border-radius:16px;padding:22px;margin:16px 0;background:linear-gradient(120deg,#142033,#101925)}.card>b{font-size:14px}.flag{background:#ff8c420b;border-color:#8e653d66;color:#ffc68f;padding:3px 9px}.small{font-size:12px}#out>.small:first-child{padding:12px 16px;border-left:2px solid #ff8c42;background:#ff8c4208}
@media(max-width:640px){.wrap{padding:18px 14px}h1{font-size:32px}.diag-nav{margin-bottom:22px}.diag-lead{font-size:12px}.bar{padding:12px;gap:8px}.bar select{flex:1 1 45%;min-width:0}#cohort button{width:100%;text-align:left}#gen{margin:4px 0}.card{padding:15px}h2{font-size:18px}}

</style></head><body><div class="wrap">
<nav class="diag-nav" aria-label="Diagnostics navigation"><span>CS2 SCOUT / DIAGNOSTICS</span><a href="/">Back to grader ↗</a></nav><div class="diag-eyebrow">Model observability</div><h1>The numbers behind the grades.</h1>
<div class="muted diag-lead">Diagnostic flags, not causes: a correctly estimated 60% pick loses 40% of the time. Cohorts, stats, map sets and model versions are never mixed.</div>
<div class="bar" id="cohort"><button data-v="eval" class="on">Evaluation snapshot (latest forecast 30+ min before start)</button><button data-v="first">First published forecast</button><button data-v="slips">Slip selections</button></div>
<div class="bar"><select aria-label="Forecast source" id="fsrc"><option value="">Board + member</option><option value="board">Underdog board</option><option value="board_pp">PrizePicks board</option><option value="member">Member research lines</option></select>
<select aria-label="Statistic" id="fprop"><option value="">Kills + HS</option><option value="kills">Kills</option><option value="hs">Headshots</option></select>
<select aria-label="Map scope" id="fscope"><option value="">All maps</option><option value="12">Maps 1–2</option><option value="1">Map 1</option><option value="123">Maps 1–3</option></select>
<select aria-label="Model version" id="fver"><option value="">All versions</option></select><span class="muted small" id="gen"></span></div>
<div id="out" class="muted">Loading…</div>
<div id="mlstore" class="card small" aria-label="Moneyline quote store"></div>
<div id="sportsgrades" class="card small" aria-label="Sports grade check"></div>
</div>
<script>
const tok = new URLSearchParams(location.search).get("token");
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const pc = x => x == null ? "–" : (x * 100).toFixed(1) + "%", n2 = x => x == null ? "–" : (+x).toFixed(2);
let D = null, cohort = "eval";
async function load() {
  let r;
  try { r = await fetch("/admin/diagnostics.json?token=" + encodeURIComponent(tok)); D = await r.json(); }
  catch (e) { $("#out").textContent = "Couldn't load diagnostics: " + e.message; return; }
  if (!r.ok || !D || D.error || !D.cohorts) {      // an error body (e.g. the build failed) - say so, never hang on Loading
    $("#out").textContent = "Couldn't load diagnostics: " + ((D && D.error) || ("server answered " + r.status)); D = null; return; }
  const vers = new Set(); for (const c of ["first", "eval"]) (D.cohorts[c]?.summary || []).forEach(s => vers.add(s.version));
  $("#fver").innerHTML = `<option value="">All versions</option>` + [...vers].map(v => `<option>${esc(v)}</option>`).join("");
  $("#gen").textContent = "generated " + D.generated; draw();
}
function draw() {
  if (!D) return;
  if (cohort === "slips") { const s = D.cohorts.slips;
    $("#out").innerHTML = `<div class="card">Shadow slip batches: ${s.batches} · most legs on one match ${s.leg_exposure_max_per_match} · on one player ${s.leg_exposure_max_per_player}<br>
      Settled legs ${s.legs_settled}: hit ${pc(s.leg_hit_rate)} vs predicted ${pc(s.leg_predicted)} <span class="muted">(too few to judge below ~150 matches)</span></div>`; return; }
  const f = s => (!$("#fsrc").value || s.source === $("#fsrc").value) && (!$("#fprop").value || s.prop === $("#fprop").value)
              && (!$("#fscope").value || s.scope === $("#fscope").value) && (!$("#fver").value || s.version === $("#fver").value);
  const rows = (D.cohorts[cohort].summary || []).filter(f);
  const ex = Object.entries(D.exclusions || {}).map(([k, v]) => `${esc(k)}: ${v}`).join(" · ");
  const m1 = D.map1_results || {};   // owner 2026-10-25: Map 1 stays off member Results until it has the threshold of settled staked units
  const mc = D.map_chance_check || {};   // 2026-11-04: HLTV's last pre-start map chances vs the maps played (mapchances.py; never a grade input)
  $("#out").innerHTML = `<div class="small muted">Excluded: ${ex}</div>
    <div class="small" id="map1res">Map 1 on member Results: ${m1.staked_settled ?? "–"} of ${m1.threshold ?? 500} settled staked P1 units · ${m1.shown_on_member_results ? "shown" : "hidden"} (admin diagnostics always include Map 1)</div>
    <div class="small" id="mapchancecheck">HLTV map chances check: ${mc.settled ?? 0} settled matches · played maps in HLTV's top k per match ${pc(mc.hit_rate_mean)}${mc.hit_rate_ci95 ? ` (95% by match ${pc(mc.hit_rate_ci95[0])}–${pc(mc.hit_rate_ci95[1])})` : ""} · n likeliest = n played ${pc(mc.top_n_hit_share)} · likeliest veto's Map 1 ${pc(mc.map1_hit_rate)} (${mc.map1_n ?? 0}) <span class="muted">(last pre-start snapshot vs match_maps; display data, weight 0)</span></div>
    <h2>Summary</h2><div class="scroll"><table><thead><tr><th>Cohort / stat / maps / version</th><th>Lines</th><th>Matches</th><th>Hit</th><th>95% (by match)</th><th>Predicted</th><th>Log loss</th>
      <th>Proj. MAE</th><th>Bias</th><th>Bias 95%</th><th>In own 80%</th><th>Rounds bias</th><th>Top grades hit / pred.</th></tr></thead><tbody>
    ${rows.map(s => `<tr><td>${esc(s.source)} · ${esc(s.prop)} · ${esc(s.scope)} · ${esc(s.version)}</td><td>${s.n}</td><td>${s.matches}</td><td>${pc(s.hit_rate)}</td>
      <td>${s.hit_ci ? `${pc(s.hit_ci[0])}–${pc(s.hit_ci[1])}` : "–"}</td><td>${pc(s.predicted)}</td><td>${n2(s.log_loss)}</td><td>${n2(s.proj_mae)}</td><td>${n2(s.proj_bias)}</td>
      <td>${s.bias_ci ? `${n2(s.bias_ci[0])}–${n2(s.bias_ci[1])}` : "–"}</td><td>${s.in80 == null ? "–" : pc(s.in80) + ` (${s.in80_n})`}</td><td>${n2(s.rounds_bias)}</td>
      <td>${s.top_selections.n ? `${pc(s.top_selections.hit_rate)} / ${pc(s.top_selections.predicted)} (${s.top_selections.n})` : "–"}</td></tr>`).join("")}</tbody></table></div>
    ${fwdHs()}
    ${clvHtml()}
    ${(D.cohorts[cohort].by_projection_source || []).length ? `<h2>Underdog board lines by projection source</h2><div class="small muted">Underdog board lines only, each model version on its own. Bias = projection minus actual (+ = projected too high), match-grouped 95% interval. Lines replayed from saved inputs only.</div>
      ${$("#fsrc").value && $("#fsrc").value !== "board" ? `<div class="small muted">Not shown for the selected forecast source: this table covers Underdog board lines only.</div>` : `
      <div class="scroll"><table><thead><tr><th>Projection / stat / maps / version</th><th>Lines</th><th>Matches</th><th>Bias</th><th>Bias 95%</th><th>Hit</th><th>Predicted</th></tr></thead><tbody>
      ${D.cohorts[cohort].by_projection_source.filter(x => (!$("#fprop").value || x.prop === $("#fprop").value) && (!$("#fscope").value || x.scope === $("#fscope").value) && (!$("#fver").value || x.version === $("#fver").value)).map(x => `<tr><td>${esc(x.projection)} · ${esc(x.prop)} · ${esc(x.scope)} · ${esc(x.version ?? Object.keys(x.versions || {}).join(", "))}</td><td>${x.n}</td><td>${x.matches}</td><td>${n2(x.proj_bias)}</td><td>${x.bias_ci ? `${n2(x.bias_ci[0])}–${n2(x.bias_ci[1])}` : "–"}</td><td>${pc(x.hit_rate)}</td><td>${pc(x.predicted)}</td></tr>`).join("")}</tbody></table></div>`}` : ""}
    <h2>Calibration</h2>${rows.map(s => `<div class="card"><b>${esc(s.source)} · ${esc(s.prop)} · ${esc(s.scope)} · ${esc(s.version)}</b>
      <div class="scroll"><table><thead><tr><th>Printed chance</th><th>Lines</th><th>Predicted</th><th>Actual</th></tr></thead><tbody>
      ${s.calibration.map(b => `<tr><td>${b.bin}</td><td>${b.n}</td><td>${pc(b.predicted)}</td><td>${pc(b.actual)}</td></tr>`).join("")}</tbody></table></div>
      <div class="small muted">Flags: ${Object.entries(s.flags).map(([k, v]) => `<span class="flag">${esc(k)} ${v}</span>`).join("") || "none"} · settled from ${esc(JSON.stringify(s.settled_from))}</div></div>`).join("")}
    <h2>Flagged lines (latest)</h2><div class="scroll"><table><thead><tr><th>Line</th><th>Side</th><th>Proj</th><th>Actual</th><th>Chance</th><th>Hit</th><th>Rounds pred / act</th><th>Rate pred / act</th><th>HS/kill pred / act</th><th>Flags</th></tr></thead><tbody>
    ${(D.cohorts[cohort].flagged_examples || []).filter(f).reverse().map(r => `<tr><td>#${r.pick_id} ${esc(r.prop)} ${r.line} (${esc(r.source)})</td><td>${esc(r.side)}</td><td>${n2(r.lam)}</td><td>${r.actual}</td><td>${pc(r.p)}</td><td>${r.hit ? "hit" : "miss"}</td>
      <td>${r.rounds_pred ?? "–"} / ${r.rounds_act ?? "–"}</td><td>${r.rate_pred ?? "–"} / ${r.rate_act ?? "–"}</td><td>${r.hsk_pred ?? "–"} / ${r.hsk_act ?? "–"}</td><td style="text-align:left">${r.flags.map(x => `<span class="flag">${esc(x)}</span>`).join("")}</td></tr>`).join("")}</tbody></table></div>`;
}
// SCOUT_CLOSING_LINES: pick-log lines vs the closing line saved at lock (closing_lines.py; never a grade input). Absent with the flag off.
function clvHtml() {
  const C = D.closing_lines; if (!C) return "";
  if (C.error) return `<h2>Closing-line value (CLV)</h2><div class="small">${esc(C.error)}</div>`;
  const ci = x => x ? ` (95% by match ${n2(x[0])} to ${n2(x[1])})` : "";
  return `<h2 id="clv">Closing-line value (CLV)</h2><div class="small muted">${esc(C.note)} Last ${esc(C.days)} days · ${C.closing_saved} closing lines saved (${C.closing_stale} last seen over ${esc(C.stale_after_min)} min before lock) · ${C.pending_in_memory} offers waiting for lock · ${C.picks_unmatched ?? 0} lines with no saved closing line · ${C.picks_without_platform ?? 0} research lines without a platform</div>
    <div class="scroll"><table><thead><tr><th>Group / platform</th><th>Lines</th><th>Matches</th><th>Mean CLV</th><th>Moved toward / same / against</th><th>Staked lines: mean CLV</th><th>Lean lines: mean CLV</th><th>Stale closing</th></tr></thead><tbody>
    ${(C.groups || []).map(g => `<tr><td>${esc(g.group)} · ${esc(g.book)}</td><td>${g.n}</td><td>${g.matches}</td><td>${n2(g.clv_mean)}${ci(g.clv_ci95)}</td><td>${g.moved_toward} / ${g.unchanged} / ${g.moved_against}</td>
      <td>${g.staked_n ? n2(g.staked_clv_mean) + ci(g.staked_clv_ci95) + ` (${g.staked_n})` : "–"}</td><td>${g.lean_n ? n2(g.lean_clv_mean) + ci(g.lean_clv_ci95) + ` (${g.lean_n})` : "–"}</td><td>${g.stale_closing}</td></tr>`).join("") || `<tr><td colspan="8">No pick-log line has a saved closing line yet</td></tr>`}</tbody></table></div>`;
}
function fwdHs() {
  const F = D.forward_hs; if (!F) return "";
  return `<h2>Forward check · board headshots, Maps 1–2</h2><div class="small muted">Status: possible Over-probability overstatement on development board data; not confirmed. Broader historical checks are encouraging. Forward validation pending.
    Evaluation snapshots logged since ${esc(F.since)} · ${F.lines} lines · ${F.matches} matches${F.versions && Object.keys(F.versions).length ? ` · current = ${Object.entries(F.versions).map(([v, n]) => `${esc(v)} (${n})`).join(", ")}` : ""}. Bands fixed in advance; actual = Over rate with a match-grouped 95% interval.</div>
    ${F.models.map(m => `<div class="card"><b>${esc(m.model)}</b> <span class="muted small">· ${m.n} lines · Over rate minus predicted ${m.gap == null ? "–" : (m.gap * 100).toFixed(1) + " pts"}${m.gap_ci ? ` (95% ${(m.gap_ci[0] * 100).toFixed(1)} to ${(m.gap_ci[1] * 100).toFixed(1)})` : ""} · log loss ${n2(m.log_loss)}${m.versions && Object.keys(m.versions).length ? ` · tags ${Object.entries(m.versions).map(([v, n]) => `${esc(v)} (${n})`).join(", ")}` : ""}${m.excluded_invalid ? ` · <b>${m.excluded_invalid} invalid rows excluded</b> (logged before the 2026-10-13 fix: graded by the old pipeline, not this model)` : ""}</span>
      <div class="scroll"><table><thead><tr><th>Chance of Over</th><th>Lines</th><th>Matches</th><th>Predicted</th><th>Actual</th><th>Actual 95%</th></tr></thead><tbody>
      ${m.bands.map(b => `<tr><td>${b.band}</td><td>${b.n}</td><td>${b.matches}</td><td>${pc(b.predicted)}</td><td>${pc(b.actual)}</td><td>${b.actual_ci ? `${pc(b.actual_ci[0])}–${pc(b.actual_ci[1])}` : "–"}</td></tr>`).join("")}</tbody></table></div></div>`).join("")}`;
}
$("#cohort").onclick = e => { const b = e.target.closest("button"); if (!b) return; cohort = b.dataset.v; [...$("#cohort").children].forEach(x => x.classList.toggle("on", x === b)); draw(); };
for (const id of ["#fsrc", "#fprop", "#fscope", "#fver"]) $(id).onchange = draw;
load();
// moneyline quote store (admin only): alert flags, archive, and the recorded gaps (ml_gaps rows are immutable)
async function loadStore() {
  let S;
  try { const r = await fetch("/admin/ml_store.json?token=" + encodeURIComponent(tok)); S = await r.json(); if (!r.ok) throw new Error(S.error || r.status); }
  catch (e) { $("#mlstore").textContent = "Moneyline quote store: couldn't load (" + e.message + ")"; return; }
  const A = S.alerts || {}, th = A.thresholds || {}, ar = S.archive || {};
  const flags = Object.entries(A.flags || {}).map(([k, f]) => `<span class="flag" style="${f.on ? "border-color:#f85149;color:#f85149" : ""}">${f.on ? "ALERT" : "ok"} · ${esc(k)}</span>`).join("");
  const gaps = (S.gaps || []).map(g => `<tr><td>${esc(g.platform)}</td><td>${esc(g.last_saved_before)}</td><td>${esc(g.first_saved_after)}</td><td>${((g.gap_s || 0) / 3600).toFixed(1)} h</td><td style="text-align:left;white-space:normal">${esc(g.reason)}</td><td style="text-align:left;white-space:normal">${esc(g.backfill)}</td></tr>`).join("");
  $("#mlstore").innerHTML = `<b>Moneyline quote store</b> · <span style="color:${A.state === "alert" ? "#f85149" : "inherit"}">${esc((A.state || "unknown").toUpperCase())}</span>${(A.on || []).length ? " · " + A.on.map(esc).join(", ") : ""}
    <div>${flags}</div>
    <div class="muted">live ${n2(S.live_mb)} MB of cap ${n2(S.cap_mb)} MB (alert above ${n2(th.size_alert_mb)}) · disk free ${esc(S.disk_free_mb)} MB (alert below ${n2(th.disk_alert_mb)}) · no save for ${esc(th.stall_alert_min)} min while a source is ok = alert ·
    archive ${esc(ar.days)} days / ${esc(ar.rows)} rows / ${n2(ar.files_mb)} MB (${esc(ar.first_day)} .. ${esc(ar.last_day)})${S.verify ? ` · last integrity check ${esc(S.verify.at)}: ${Object.keys(S.verify.problems || {}).length} problems in ${esc(S.verify.files)} files` : ""}</div>
    <div class="scroll"><table><thead><tr><th>Platform</th><th>Last saved before</th><th>First saved after</th><th>Gap</th><th>Reason</th><th>Backfill</th></tr></thead><tbody>${gaps || `<tr><td colspan="6">No recorded gaps</td></tr>`}</tbody></table></div>
    <div class="muted">${esc(S.gaps_total ?? (S.gaps || []).length)} recorded gaps (immutable; missing quotes are never backfilled)</div>`;
}
loadStore();
// Scout Sports daily grade check (REGISTER A9a): per league the A9 5 verdict, letters stated vs hit, and containment
async function loadSportsGrades() {
  const el = $("#sportsgrades");
  let G;
  try {
    const t = await (await fetch("/api/sports/token", { headers: { "X-Admin-Token": tok }, cache: "no-store" })).json();
    if (!t.token) throw new Error(t.error || "no sports token");
    const r = await fetch((t.api_base || "").replace(/\/$/, "") + "/api/sports/admin/model/gradecheck?part=headline",
                          { headers: { "Authorization": "Bearer " + t.token }, cache: "no-store" });
    G = await r.json(); if (!r.ok) throw new Error(G.error || r.status);
  } catch (e) { el.textContent = "Sports grade check: couldn't load (" + e.message + ")"; return; }
  const H = G.headline || {}, C = (G.containment || {}).leagues || {};
  const ci = c => c && c[0] != null ? `${pc(c[0])}–${pc(c[1])}` : "–";
  const lgs = [...new Set([...Object.keys(H), ...Object.keys(C)])].sort();
  el.innerHTML = `<b>Sports grade check</b> · game-day ${esc(G.game_day || "none yet")} · generated ${esc(G.generated_at || "–")}
    ${lgs.map(lg => { const h = H[lg] || {}, c = C[lg] || {}, L = h.letters || {};
      const shown = c.contained ? "letters HIDDEN" : ((c.stats || []).length ? "letters shown except " + c.stats.map(esc).join(", ") : "letters shown");
      const envNote = c.env_asked ? ` · env asked to ${esc(c.env_asked)}${c.env_applied ? " (applied)" : " (ignored: the switch can only contain)"}` : "";
      return `<div style="margin-top:6px"><b>${esc(lg.toUpperCase())}</b> · verdict <b>${esc(h.verdict || "–")}</b> · ${shown} <span class="muted">(${esc(c.source || "–")}${envNote})</span>
      <div class="muted">${esc(h.why || "")} · A+B n ${esc(h.n ?? "–")} from ${esc(h.games ?? "–")} games / ${esc(h.game_days ?? "–")} days · cal-mi ON: ${(h.cal_mi_on || []).map(esc).join(", ") || "none"}</div>
      <div class="scroll"><table><thead><tr><th>Grade</th><th>n</th><th>Stated</th><th>Hit</th><th>95% (by game)</th></tr></thead><tbody>
      ${["A", "B", "C", "Lean", "AB"].filter(g => L[g]).map(g => `<tr><td>${g === "AB" ? "A+B" : g}</td><td>${esc(L[g].n ?? "–")}</td><td>${pc(L[g].stated)}</td><td>${pc(L[g].hit)}</td><td>${ci(L[g].ci)}</td></tr>`).join("") || `<tr><td colspan="5">No daily run yet</td></tr>`}
      </tbody></table></div></div>`; }).join("")}`;
}
loadSportsGrades();
</script></body></html>
